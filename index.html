<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI 程式設計競技場（免 API Key 手動對決版）</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- 頂部：出題產生器 -->
  <header class="bg-slate-900 border-b border-slate-800 p-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚔️</span>
        <h1 class="text-lg font-bold text-cyan-400">AI Code Arena（免 Key 單機對決版）</h1>
      </div>
      
      <div class="flex-1 flex gap-2 w-full md:max-w-2xl">
        <input id="topic-input" type="text" 
          value="用單一 HTML 檔案寫一個霓虹風格的貪吃蛇遊戲，要有計分板、加速道具與重新開始按鈕" 
          class="flex-1 bg-slate-800 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-cyan-500"
          placeholder="輸入你想考 AI 的題目...">
        <button onclick="copyPrompt()" id="copy-btn" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-1.5 rounded text-sm font-bold whitespace-nowrap transition">
          📋 複製標準出題 Prompt
        </button>
      </div>
    </div>
  </header>

  <!-- 貼上程式碼區（可收合） -->
  <section id="setup-panel" class="max-w-7xl mx-auto w-full p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
      <!-- 左側輸入 -->
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
        <div class="flex justify-between items-center mb-2">
          <input id="name-1" type="text" value="ChatGPT" class="bg-slate-800 text-amber-400 font-bold text-sm px-2 py-1 rounded border border-slate-700 w-40">
          <span class="text-xs text-slate-400">貼上第一位 AI 的程式碼</span>
        </div>
        <textarea id="raw-1" rows="5" placeholder="把第一個 AI 產出的 HTML 程式碼整段貼在這裡..." class="w-full bg-slate-950 text-xs text-green-400 p-2 rounded border border-slate-800 font-mono focus:outline-none focus:border-amber-500"></textarea>
      </div>

      <!-- 右側輸入 -->
      <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
        <div class="flex justify-between items-center mb-2">
          <input id="name-2" type="text" value="Gemini" class="bg-slate-800 text-purple-400 font-bold text-sm px-2 py-1 rounded border border-slate-700 w-40">
          <span class="text-xs text-slate-400">貼上第二位 AI 的程式碼</span>
        </div>
        <textarea id="raw-2" rows="5" placeholder="把第二個 AI 產出的 HTML 程式碼整段貼在這裡..." class="w-full bg-slate-950 text-xs text-green-400 p-2 rounded border border-slate-800 font-mono focus:outline-none focus:border-purple-500"></textarea>
      </div>
    </div>

    <div class="flex justify-center items-center gap-4">
      <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer select-none">
        <input id="blind-mode" type="checkbox" checked class="accent-cyan-500 w-4 h-4">
        啟用盲測模式（隨機交換左右位置，投票後才揭曉誰是誰）
      </label>
      <button onclick="startBattle()" class="bg-gradient-to-r from-amber-500 to-purple-600 hover:opacity-90 px-6 py-2 rounded-lg font-bold text-white shadow-lg transition">
        ⚔️ 開始渲染對決！
      </button>
    </div>
  </section>

  <!-- 雙欄並排競技場舞台 -->
  <main id="arena-stage" class="hidden flex-1 max-w-7xl mx-auto w-full px-4 pb-6 flex flex-col">
    <div class="flex justify-between items-center mb-2">
      <button onclick="resetSetup()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded border border-slate-700">
        ⬅️ 修改題目 / 重新貼上程式碼
      </button>
      <span id="status-banner" class="text-sm font-bold text-cyan-400">盲測進行中：請試玩兩邊的成品並選出較優者！</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
      <!-- 舞台 A -->
      <div class="flex flex-col bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
        <div class="p-2.5 bg-slate-800/80 flex justify-between items-center">
          <span id="title-a" class="font-bold text-amber-400">🤖 選手 A（神秘模型）</span>
          <button onclick="toggleCode('a')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">切換原始碼</button>
        </div>
        <iframe id="frame-a" sandbox="allow-scripts" class="w-full h-[520px] bg-white"></iframe>
        <pre id="code-a" class="hidden p-3 text-xs overflow-auto h-[520px] bg-slate-950 text-green-400 font-mono"></pre>
      </div>

      <!-- 舞台 B -->
      <div class="flex flex-col bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
        <div class="p-2.5 bg-slate-800/80 flex justify-between items-center">
          <span id="title-b" class="font-bold text-purple-400">🤖 選手 B（神秘模型）</span>
          <button onclick="toggleCode('b')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">切換原始碼</button>
        </div>
        <iframe id="frame-b" sandbox="allow-scripts" class="w-full h-[520px] bg-white"></iframe>
        <pre id="code-b" class="hidden p-3 text-xs overflow-auto h-[520px] bg-slate-950 text-green-400 font-mono"></pre>
      </div>
    </div>

    <!-- 投票揭曉區 -->
    <div id="vote-bar" class="mt-4 flex justify-center gap-4">
      <button onclick="revealWinner('A')" class="bg-amber-600 hover:bg-amber-500 px-6 py-2.5 rounded-lg font-bold shadow">👈 左邊 (選手 A) 勝出</button>
      <button onclick="revealWinner('TIE')" class="bg-slate-700 hover:bg-slate-600 px-6 py-2.5 rounded-lg font-bold shadow">🤝 平手</button>
      <button onclick="revealWinner('B')" class="bg-purple-600 hover:bg-purple-500 px-6 py-2.5 rounded-lg font-bold shadow">👉 右邊 (選手 B) 勝出</button>
    </div>
  </main>

  <script>
    let contestants = { A: { name: '', code: '' }, B: { name: '', code: '' } };

    // 自動剝除 AI 回覆中的 ```html ... ``` 與前後廢話
    function cleanHtml(raw) {
      const match = raw.match(/```html\s*([\s\S]*?)\s*```/i) || raw.match(/```\s*([\s\S]*?)\s*```/);
      if (match) return match[1].trim();
      const docStart = raw.indexOf('<!DOCTYPE html>');
      const htmlStart = raw.indexOf('<html');
      const startIdx = docStart !== -1 ? docStart : htmlStart;
      return startIdx !== -1 ? raw.slice(startIdx).trim() : raw.trim();
    }

    function copyPrompt() {
      const topic = document.getElementById('topic-input').value.trim();
      const fullPrompt = `請擔任頂尖前端與遊戲工程師，根據以下需求寫出一個「完全獨立、單一 HTML 檔案」的可執行網頁或小遊戲。\n需求：${topic}\n\n嚴格規則：\n1. 所有 CSS 與 JavaScript 必須全部寫在同一個 HTML 檔案內，不可引用外部本地檔案。\n2. 只輸出純 HTML 程式碼，不要有任何解釋文字。`;
      navigator.clipboard.writeText(fullPrompt);
      const btn = document.getElementById('copy-btn');
      btn.innerText = '✅ 已複製！去貼給兩個 AI';
      setTimeout(() => btn.innerText = '📋 複製標準出題 Prompt', 2000);
    }

    function startBattle() {
      const c1 = { name: document.getElementById('name-1').value || 'AI 1', code: cleanHtml(document.getElementById('raw-1').value) };
      const c2 = { name: document.getElementById('name-2').value || 'AI 2', code: cleanHtml(document.getElementById('raw-2').value) };

      if (!c1.code || !c2.code) {
        alert('請先在左右兩邊都貼上 AI 產出的程式碼！');
        return;
      }

      const isBlind = document.getElementById('blind-mode').checked;
      const swap = isBlind && Math.random() > 0.5;

      contestants.A = swap ? c2 : c1;
      contestants.B = swap ? c1 : c2;

      document.getElementById('title-a').innerText = isBlind ? '🤖 選手 A（神秘模型）' : `🤖 選手 A：${contestants.A.name}`;
      document.getElementById('title-b').innerText = isBlind ? '🤖 選手 B（神秘模型）' : `🤖 選手 B：${contestants.B.name}`;
      document.getElementById('status-banner').innerText = isBlind ? '盲測進行中：請試玩兩邊的成品並選出較優者！' : '公開對決進行中！';

      document.getElementById('frame-a').srcdoc = contestants.A.code;
      document.getElementById('frame-b').srcdoc = contestants.B.code;
      document.getElementById('code-a').textContent = contestants.A.code;
      document.getElementById('code-b').textContent = contestants.B.code;

      document.getElementById('setup-panel').classList.add('hidden');
      document.getElementById('arena-stage').classList.remove('hidden');
    }

    function revealWinner(winner) {
      document.getElementById('title-a').innerText = `🤖 選手 A：${contestants.A.name} ${winner === 'A' ? '👑 勝出' : ''}`;
      document.getElementById('title-b').innerText = `🤖 選手 B：${contestants.B.name} ${winner === 'B' ? '👑 勝出' : ''}`;
      document.getElementById('status-banner').innerText = `🎉 揭曉結果：左邊是 ${contestants.A.name}，右邊是 ${contestants.B.name}！`;
    }

    function toggleCode(side) {
      document.getElementById(`frame-${side}`).classList.toggle('hidden');
      document.getElementById(`code-${side}`).classList.toggle('hidden');
    }

    function resetSetup() {
      document.getElementById('arena-stage').classList.add('hidden');
      document.getElementById('setup-panel').classList.remove('hidden');
    }
  </script>
</body>
</html>
