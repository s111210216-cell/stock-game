<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI 程式設計競技場 (Code Arena)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- 頂部導覽與題目區 -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-cyan-400">⚔️ AI Code Arena 盲測競技場</h1>
      <p id="prompt-display" class="text-sm text-slate-300 mt-1">載入題目中...</p>
    </div>
    <button onclick="loadNextMatch()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded text-sm border border-slate-600">
      換下一場對決 ➔
    </button>
  </header>

  <!-- 左右雙欄對戰沙盒區 -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 p-4">
    <!-- Model A -->
    <div class="flex flex-col bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
      <div class="p-3 bg-slate-800/60 flex justify-between items-center">
        <span id="label-a" class="font-bold text-amber-400">🤖 選手 A（神秘模型）</span>
        <button onclick="toggleCode('A')" class="text-xs bg-slate-700 px-2 py-1 rounded">檢視原始碼</button>
      </div>
      <iframe id="frame-a" sandbox="allow-scripts" class="w-full h-[500px] bg-white"></iframe>
      <pre id="code-a" class="hidden p-3 text-xs overflow-auto h-[500px] bg-slate-950 text-green-400"></pre>
    </div>

    <!-- Model B -->
    <div class="flex flex-col bg-slate-900 rounded-lg border border-slate-800 overflow-hidden">
      <div class="p-3 bg-slate-800/60 flex justify-between items-center">
        <span id="label-b" class="font-bold text-purple-400">🤖 選手 B（神秘模型）</span>
        <button onclick="toggleCode('B')" class="text-xs bg-slate-700 px-2 py-1 rounded">檢視原始碼</button>
      </div>
      <iframe id="frame-b" sandbox="allow-scripts" class="w-full h-[500px] bg-white"></iframe>
      <pre id="code-b" class="hidden p-3 text-xs overflow-auto h-[500px] bg-slate-950 text-green-400"></pre>
    </div>
  </main>

  <!-- 投票控制台與排行榜 -->
  <footer class="bg-slate-900 border-t border-slate-800 p-4">
    <div id="vote-panel" class="flex justify-center gap-4 mb-4">
      <button onclick="submitVote('A')" class="bg-amber-600 hover:bg-amber-500 px-6 py-2 rounded-lg font-bold">👈 左邊 (A) 寫得比較好</button>
      <button onclick="submitVote('TIE')" class="bg-slate-700 hover:bg-slate-600 px-6 py-2 rounded-lg font-bold">🤝 旗鼓相當（平手）</button>
      <button onclick="submitVote('B')" class="bg-purple-600 hover:bg-purple-500 px-6 py-2 rounded-lg font-bold">👉 右邊 (B) 寫得比較好</button>
    </div>

    <!-- 即時 Elo 排行榜 -->
    <div class="max-w-3xl mx-auto">
      <h2 class="text-sm font-bold text-slate-400 mb-2">🏆 即時模型戰力排行榜 (Elo Rating)</h2>
      <div id="leaderboard" class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs"></div>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "你的_SUPABASE_URL";
    const SUPABASE_KEY = "你的_SUPABASE_ANON_KEY";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMatch = null;
    let hasVoted = false;

    async function loadNextMatch() {
      hasVoted = false;
      document.getElementById('vote-panel').classList.remove('opacity-50', 'pointer-events-none');
      
      // 撈取尚未投票的對戰，若都投完了就隨機撈一場
      let { data } = await db.from('arena_matches').select('*').is('winner', null).limit(1);
      if (!data || data.length === 0) {
        const res = await db.from('arena_matches').select('*').limit(10);
        data = res.data ? [res.data[Math.floor(Math.random() * res.data.length)]] : [];
      }
      if (!data || data.length === 0) {
        document.getElementById('prompt-display').innerText = "目前沒有對戰資料，請先在 Colab 執行 create_match() 生成對戰！";
        return;
      }

      currentMatch = data[0];
      document.getElementById('prompt-display').innerText = `題目：${currentMatch.prompt}`;
      document.getElementById('label-a').innerText = "🤖 選手 A（神秘模型）";
      document.getElementById('label-b').innerText = "🤖 選手 B（神秘模型）";

      // 使用 srcdoc 在沙盒中安全渲染 AI 寫的網頁
      document.getElementById('frame-a').srcdoc = currentMatch.code_a;
      document.getElementById('frame-b').srcdoc = currentMatch.code_b;
      document.getElementById('code-a').textContent = currentMatch.code_a;
      document.getElementById('code-b').textContent = currentMatch.code_b;
    }

    function toggleCode(side) {
      const frame = document.getElementById(`frame-${side.toLowerCase()}`);
      const code = document.getElementById(`code-${side.toLowerCase()}`);
      frame.classList.toggle('hidden');
      code.classList.toggle('hidden');
    }

    async function submitVote(result) {
      if (!currentMatch || hasVoted) return;
      hasVoted = true;
      document.getElementById('vote-panel').classList.add('opacity-50', 'pointer-events-none');

      // 揭曉兩邊模型的真實身分
      document.getElementById('label-a').innerText = `🤖 選手 A：${currentMatch.model_a}`;
      document.getElementById('label-b').innerText = `🤖 選手 B：${currentMatch.model_b}`;

      // 取得雙方目前 Elo 分數並計算新積分 (K=32)
      const { data: models } = await db.from('arena_models').select('*').in('model_id', [currentMatch.model_a, currentMatch.model_b]);
      const mA = models.find(m => m.model_id === currentMatch.model_a);
      const mB = models.find(m => m.model_id === currentMatch.model_b);

      const expectedA = 1 / (1 + Math.pow(10, (mB.elo_rating - mA.elo_rating) / 400));
      const scoreA = result === 'A' ? 1 : (result === 'TIE' ? 0.5 : 0);
      const delta = Math.round(32 * (scoreA - expectedA));

      await db.from('arena_models').update({
        elo_rating: mA.elo_rating + delta,
        wins: mA.wins + (result === 'A' ? 1 : 0),
        losses: mA.losses + (result === 'B' ? 1 : 0),
        ties: mA.ties + (result === 'TIE' ? 1 : 0)
      }).eq('model_id', mA.model_id);

      await db.from('arena_models').update({
        elo_rating: mB.elo_rating - delta,
        wins: mB.wins + (result === 'B' ? 1 : 0),
        losses: mB.losses + (result === 'A' ? 1 : 0),
        ties: mB.ties + (result === 'TIE' ? 1 : 0)
      }).eq('model_id', mB.model_id);

      await db.from('arena_matches').update({ winner: result }).eq('id', currentMatch.id);
      loadLeaderboard();
    }

    async function loadLeaderboard() {
      const { data } = await db.from('arena_models').select('*').order('elo_rating', { ascending: false });
      const container = document.getElementById('leaderboard');
      container.innerHTML = data.map((m, i) => `
        <div class="bg-slate-800 p-2 rounded border border-slate-700 flex justify-between">
          <span>#${i + 1} ${m.display_name}</span>
          <span class="text-cyan-400 font-mono">${m.elo_rating} (${m.wins}W/${m.losses}L)</span>
        </div>
      `).join('');
    }

    loadNextMatch();
    loadLeaderboard();
  </script>
</body>
</html>
