const NEWS_BIAS = [0.55, 0.65, -0.55, -0.65, 0.0];

function safeGetStorage(key) {
  try { return window.localStorage.getItem(key); } catch (e) { return null; }
}
function safeSetStorage(key, val) {
  try { window.localStorage.setItem(key, val); } catch (e) {}
}

function syncRand(t, s) {
  const x = Math.sin(t * 12.9898 + s * 78.233) * 43758.5453;
  return x - Math.floor(x);
}

function getGlobalMarketState(t) {
  const block = Math.floor(t / 8);
  const ev = syncRand(block, 777);
  if (ev < 0.09) return { bias: -1.55, mode: "BLACK_SWAN", label: "🦢 黑天鵝突襲", news: "⚡ 突發利空衝擊，全市場恐慌拋售！" };
  if (ev > 0.91) return { bias: 1.55, mode: "SUPER_BULL", label: "🚀 超級牛市", news: "🔥 重大利多噴發，資金全面湧入！" };
  const idx = Math.floor(syncRand(block, 999) * NEWS_BIAS.length);
  const b = NEWS_BIAS[idx];
  if (b > 0) return { bias: b, mode: "NORMAL", label: "偏多格局", news: "📈 外資買盤回溫，市場氣氛偏多" };
  if (b < 0) return { bias: b, mode: "NORMAL", label: "偏空格局", news: "📉 獲利賣壓浮現，短線氣氛偏空" };
  return { bias: 0.0, mode: "NORMAL", label: "震盪整理", news: "📰 多空交戰，量能觀望整理中" };
}

function getEpochSeries(stockKey, currentTick) {
  const st = STOCKS[stockKey];
  const epochStart = Math.floor(currentTick / 360) * 360;
  let p = st.base;
  const series = [{ tick: epochStart, price: p }];
  for (let t = epochStart + 1; t <= currentTick; t++) {
    const { bias } = getGlobalMarketState(t);
    const r = syncRand(t, st.seed);
    p = Math.max(2.0, p * (1.0 + ((r - 0.5 + bias * 0.35) * st.vol) / 100.0));
    series.push({ tick: t, price: p });
  }
  return series;
}

  if (cash < 300) cash = 3000;

  updateUserPanel(currentTick);

}

function drawRedGreenChart(series, basePrice) {
  const canvas = document.getElementById("price-chart");
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || canvas.parentElement.clientWidth || 700;
  const h = rect.height || canvas.parentElement.clientHeight || 288;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const visible = series.slice(-90);
  if (visible.length < 2) return;

  const prices = visible.map(d => d.price);
  const minP = Math.min(...prices, basePrice) * 0.9985;
  const maxP = Math.max(...prices, basePrice) * 1.0015;
  const range = Math.max(0.01, maxP - minP);

  const padL = 14, padR = 58, padT = 18, padB = 22;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  const getX = idx => padL + (idx / Math.max(1, visible.length - 1)) * plotW;
  const getY = val => padT + (1 - (val - minP) / range) * plotH;

  ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
  ctx.lineWidth = 1;
  ctx.font = "11px monospace";
  ctx.fillStyle = "#64748b";
  for (let i = 0; i <= 4; i++) {
    const y = padT + (plotH / 4) * i;
    const priceLabel = (maxP - (range / 4) * i).toFixed(2);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.fillText(priceLabel, w - padR + 6, y + 4);
  }

  const baseY = getY(basePrice);
  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = "rgba(250, 204, 21, 0.45)";
  ctx.beginPath();
  ctx.moveTo(padL, baseY);
  ctx.lineTo(w - padR, baseY);
  ctx.stroke();
  ctx.restore();

  for (let i = 1; i < visible.length; i++) {
    const p0 = Number(visible[i - 1].price);
    const p1 = Number(visible[i].price);
    const x0 = getX(i - 1);
    const y0 = getY(p0);
    const x1 = getX(i);
    const y1 = getY(p1);

    const isUp = p1 >= p0;
    const strokeCol = isUp ? "#ef4444" : "#22c55e";
    const fillCol = isUp ? "rgba(239, 68, 68, 0.16)" : "rgba(34, 197, 94, 0.16)";

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x1, padT + plotH);
    ctx.lineTo(x0, padT + plotH);
    ctx.closePath();
    ctx.fillStyle = fillCol;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  const last = visible[visible.length - 1];
  const lastX = getX(visible.length - 1);
  const lastY = getY(last.price);
  const overallUp = last.price >= basePrice;
  ctx.beginPath();
  ctx.arc(lastX, lastY, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = overallUp ? "#ef4444" : "#22c55e";
  ctx.fill();
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function updateUserPanel(currentTick) {
  document.getElementById("user-cash").textContent = "$" + Math.round(cash).toLocaleString();
  const posBadge = document.getElementById("user-pos-badge");
  const posDetail = document.getElementById("user-pos-detail");
  const closeBtn = document.getElementById("close-pos-btn");

  let totalNw = cash;
  if (userPos) {
    const series = getEpochSeries(userPos.code, currentTick);
    const curPrice = series[series.length - 1].price;
    const pnl = userPos.margin * ((curPrice - userPos.entryPrice) / userPos.entryPrice) * userPos.lev * (userPos.dir === "LONG" ? 1 : -1);
    const roi = (pnl / userPos.margin) * 100;

    if (userPos.margin + pnl <= 0) {
      userPos = null;
      cash = Math.max(cash, 3000);
      totalNw = cash;
      alert("💥 觸發強制平倉（爆倉），系統發放 $3,000 救濟金！");
    } else {
      totalNw = cash + userPos.margin + pnl;
      const isProfit = pnl >= 0;
      posBadge.textContent = (userPos.dir === "LONG" ? "做多 " : "做空 ") + userPos.lev + "x";
      posBadge.className = "text-xs px-2 py-0.5 rounded font-bold " + (userPos.dir === "LONG" ? "up-bg" : "down-bg");
      posDetail.innerHTML =
        '<div class="flex justify-between"><span>標的：</span><b class="text-white">' + userPos.code + " " + STOCKS[userPos.code].name + "</b></div>" +
        '<div class="flex justify-between"><span>開倉均價 / 現價：</span><span class="font-mono text-slate-200">' + userPos.entryPrice.toFixed(2) + " → " + curPrice.toFixed(2) + "</span></div>" +
        '<div class="flex justify-between"><span>未實現損益：</span><b class="' + (isProfit ? "up-text" : "down-text") + '">' + (pnl >= 0 ? "+" : "") + Math.round(pnl).toLocaleString() + " (" + (roi >= 0 ? "+" : "") + roi.toFixed(1) + "%)</b></div>";
      closeBtn.disabled = false;
      closeBtn.className = "w-full py-2 rounded-lg text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 cursor-pointer transition";
    }
  }

  if (!userPos) {
    posBadge.textContent = "空手觀望中";
    posBadge.className = "text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400";
    posDetail.innerHTML = "<div>選擇標的與槓桿後，點擊左側按鈕進場。</div>";
    closeBtn.disabled = true;
    closeBtn.className = "w-full py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-500 cursor-not-allowed";
  }

  document.getElementById("user-net-worth").textContent = "$" + Math.round(totalNw).toLocaleString();
  return totalNw;
}

    const tabsEl = document.getElementById("stock-tabs");
    tabsEl.innerHTML = "";
    Object.entries(STOCKS).forEach(([code, st]) => {
      const s = getEpochSeries(code, currentTick);
      const cur = s[s.length - 1].price;
      const pct = ((cur - st.base) / st.base) * 100;
      const isUp = pct >= 0;
      const active = code === selectedStock;

      const btn = document.createElement("button");

      btn.className = "p-2.5 rounded-xl border text-left transition " +
        (active ? "bg-slate-800/95 border-indigo-500 shadow-md" : "bg-slate-900/70 border-slate-800 hover:border-slate-700");
      btn.onclick = () => { selectedStock = code; renderTick(); };
      btn.innerHTML =
        '<div class="flex justify-between items-center text-xs">' +
          '<span class="font-bold text-white">' + code + '</span>' +
          '<span class="font-bold ' + (isUp ? "up-text" : "down-text") + '">' + (isUp ? "+" : "") + pct.toFixed(2) + '%</span>' +
        '</div>' +
        '<div class="text-[11px] text-slate-400 truncate">' + st.name + '</div>' +
        '<div class="text-sm font-extrabold font-mono mt-0.5 ' + (isUp ? "up-text" : "down-text") + '">' + cur.toFixed(2) + '</div>';
      tabsEl.appendChild(btn);
    });

    const activeSeries = getEpochSeries(selectedStock, currentTick);
    const stInfo = STOCKS[selectedStock];
    const latestPrice = activeSeries[activeSeries.length - 1].price;
    const diff = latestPrice - stInfo.base;
    const diffPct = (diff / stInfo.base) * 100;
    const isUp = diff >= 0;

    document.getElementById("chart-stock-title").textContent = selectedStock + " " + stInfo.name;
    const priceEl = document.getElementById("chart-current-price");
    priceEl.textContent = latestPrice.toFixed(2);
    priceEl.className = "text-3xl font-extrabold tracking-tight font-mono " + (isUp ? "up-text" : "down-text");

    const changeEl = document.getElementById("chart-price-change");
    changeEl.textContent = (isUp ? "+" : "") + diff.toFixed(2) + " (" + (isUp ? "+" : "") + diffPct.toFixed(2) + "%)";
    changeEl.className = "text-sm font-bold px-2 py-0.5 rounded " + (isUp ? "up-bg" : "down-bg");

    drawRedGreenChart(activeSeries, stInfo.base);
    updateUserPanel(currentTick);
  } catch (err) {
    console.error("renderTick error:", err);
  }
}

async function fetchAiAndLeaderboard() {
  const headers = { apikey: SUPABASE_KEY };
  try {
    const aiRes = await fetch(SUPABASE_URL + "/rest/v1/ai_live_status?id=eq.1&select=*", { headers });
    const aiRows = await aiRes.json();
    if (aiRows && aiRows.length > 0) {
      const ai = aiRows[0];
      const updatedMs = new Date(ai.updated_at).getTime();
      const isOnline = Date.now() - updatedMs < 15000;

      const dotEl = document.getElementById("ai-online-dot");
      dotEl.innerHTML = isOnline
        ? '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span><span class="text-emerald-400 font-bold">在線交易中</span>'
        : '<span class="w-2 h-2 rounded-full bg-slate-500"></span><span>休眠中</span>';

      if (ai.direction && ai.direction !== "NONE") {
        document.getElementById("ai-stock").textContent = ai.stock_code + " " + ai.stock_name;
        const dirEl = document.getElementById("ai-dir-lev");
        dirEl.textContent = (ai.direction === "LONG" ? "做多 LONG" : "做空 SHORT") + " · " + ai.leverage + "x";
        dirEl.className = "font-bold " + (ai.direction === "LONG" ? "up-text" : "down-text");
        document.getElementById("ai-entry-margin").textContent = Number(ai.entry_price).toFixed(2) + " / $" + Number(ai.margin).toLocaleString();
      } else {
        document.getElementById("ai-stock").textContent = "空手觀望中";
        document.getElementById("ai-dir-lev").textContent = "-";
        document.getElementById("ai-dir-lev").className = "font-bold text-slate-300";
        document.getElementById("ai-entry-margin").textContent = "-";
      }
      document.getElementById("ai-live-nw").textContent = "$" + Math.round(Number(ai.net_worth || 10000)).toLocaleString();
    }

    const lbRes = await fetch(SUPABASE_URL + "/rest/v1/leaderboard?select=*&order=net_worth.desc&limit=20", { headers });
    const lbRows = await lbRes.json();
    const listEl = document.getElementById("leaderboard-list");
    if (lbRows && lbRows.length > 0) {
      listEl.innerHTML = lbRows.map((row, idx) => {
        const isAi = String(row.player_name).toLowerCase() === "ai";
        const isMe = row.player_name === playerName;
        const roi = Number(row.return_rate || 0);
        const boxCls = isAi
          ? "bg-indigo-950/40 border-indigo-500/40"
          : (isMe ? "bg-slate-800/80 border-amber-500/40" : "bg-slate-900/60 border-slate-800");
        return '<div class="flex items-center justify-between p-2.5 rounded-lg border ' + boxCls + '">' +
          '<div class="flex items-center gap-2.5 min-w-0">' +
            '<span class="w-5 text-xs font-extrabold ' + (idx < 3 ? "text-amber-400" : "text-slate-500") + '">#' + (idx + 1) + '</span>' +
            '<span class="text-sm font-bold text-white truncate">' + row.player_name + '</span>' +
            (isAi ? '<span class="ai-badge">AI</span>' : '') +
          '</div>' +
          '<div class="text-right shrink-0">' +
            '<div class="text-sm font-extrabold font-mono text-white">$' + Number(row.net_worth).toLocaleString() + '</div>' +
            '<div class="text-[11px] font-bold ' + (roi >= 0 ? "up-text" : "down-text") + '">' + (roi >= 0 ? "+" : "") + roi.toFixed(1) + '%</div>' +
          '</div>' +
        '</div>';
      }).join("");
    }
  } catch (e) {
    console.warn("Supabase sync error:", e);
  }
}

async function syncUserLeaderboard() {
  const currentTick = Math.floor(Date.now() / 800);
  const nw = Math.max(0, Math.round(updateUserPanel(currentTick)));
  const roi = Number((((nw - 10000) / 10000) * 100).toFixed(2));
  const headers = {
    apikey: SUPABASE_KEY,
    "Content-Type": "application/json",
    Prefer: "return=minimal"
  };
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/leaderboard?select=id&player_name=eq." + encodeURIComponent(playerName) + "&limit=1", { headers: { apikey: SUPABASE_KEY } });
    const rows = await res.json();
    const payload = { net_worth: nw, return_rate: roi, created_at: new Date().toISOString() };
    if (rows && rows.length > 0) {
      await fetch(SUPABASE_URL + "/rest/v1/leaderboard?id=eq." + rows[0].id, {
        method: "PATCH",
        headers,
        body: JSON.stringify(payload)
      });
    } else {
      await fetch(SUPABASE_URL + "/rest/v1/leaderboard", {
        method: "POST",
        headers,
        body: JSON.stringify({ player_name: playerName, ...payload })
      });
    }
  } catch (e) {
    console.warn("Leaderboard upload error:", e);
  }
}

window.addEventListener("DOMContentLoaded", () => {
  renderTick();
  fetchAiAndLeaderboard();
  setInterval(renderTick, 800);
  setInterval(() => {
    syncUserLeaderboard();
    fetchAiAndLeaderboard();
  }, 4000);
});
</script>
