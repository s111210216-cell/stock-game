<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚡ 全球同步量化交易室 v6.0 (公平競技版)</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--up:#ff4d4f;--down:#00e676;--gold:#ffd700;--accent:#58a6ff}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{background:var(--bg);color:var(--text);padding:12px;max-width:960px;margin:0 auto;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
  .flex{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700}
  .bg-up{background:rgba(255,77,79,.15);color:var(--up);border:1px solid var(--up)}
  .bg-down{background:rgba(0,230,118,.15);color:var(--down);border:1px solid var(--down)}
  .bg-gold{background:rgba(255,215,0,.15);color:var(--gold);border:1px solid var(--gold)}
  .bg-ai{background:rgba(88,166,255,.15);color:var(--accent);border:1px solid var(--accent)}
  .stocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-bottom:10px}
  .stk{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:.15s}
  .stk.active{border-color:var(--accent);background:#1c2331}
  .price{font-size:18px;font-weight:800;margin-top:4px}
  .up{color:var(--up)}.down{color:var(--down)}
  canvas{width:100%;height:200px;background:#090c10;border-radius:8px;border:1px solid var(--border);display:block}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  button{border:none;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer;font-size:14px;color:#fff;transition:.15s}
  button:active{transform:scale(.98)}
  .btn-long{background:#d9363e}.btn-short{background:#00b359;color:#000}
  .btn-close{background:#d48806;width:100%;margin-top:8px}.btn-sub{background:#21262d;border:1px solid var(--border);color:var(--text)}
  .lev-row{display:flex;gap:6px;margin:8px 0}
  .lev-btn{flex:1;padding:6px;background:#21262d;border:1px solid var(--border);color:var(--text)}
  .lev-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
  .prog-bg{width:100%;height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin-top:6px}
  .prog-bar{height:100%;transition:width .3s,background .3s}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
  .rank-buffett{color:#ffd700;font-weight:800}.rank-god{color:#ff7b72;font-weight:700}
  .rank-wolf{color:#79c0ff}.rank-whale{color:#7ee787}.rank-rookie{color:#8b949e}
  input{background:#0d1117;border:1px solid var(--border);color:#fff;padding:8px 10px;border-radius:6px;font-size:14px}
  .ai-live-box{border:1px solid #388bfd66;background:linear-gradient(135deg,#161b22 0%,#132035 100%)}
  @media(max-width:600px){.stocks{grid-template-columns:repeat(2,1fr)}canvas{height:170px}}
</style>
</head>
<body>

<div class="card flex">
  <div>
    <div style="font-size:12px;color:#8b949e">總淨值 (USD) · 每日 UTC+8 零點重置</div>
    <div id="netWorth" style="font-size:24px;font-weight:900;color:#fff">$10,000</div>
  </div>
  <div style="text-align:right">
    <span id="marketEvent" class="badge bg-gold">🌐 市場平穩波動</span>
    <div id="cashInfo" style="font-size:12px;color:#8b949e;margin-top:4px">可用現金: $10,000</div>
  </div>
</div>

<!-- 新增：公開透明的官方 AI 實盤持倉看板 -->
<div class="card ai-live-box">
  <div class="flex">
    <div style="font-weight:800;color:#58a6ff">🤖 官方量化 AI 實盤持倉（全服公開）</div>
    <span id="aiOnlineTag" class="badge bg-ai">偵測連線中...</span>
  </div>
  <div id="aiLiveDetail" style="margin-top:8px;font-size:13px;line-height:1.6;color:#c9d1d9">
    正在讀取 AI 即時部位數據...
  </div>
</div>

<div class="stocks" id="stockList"></div>

<div class="card">
  <div class="flex" style="margin-bottom:8px">
    <strong id="chartTitle">3481 群創 · 即時走勢</strong>
    <span id="liqPriceTag" style="font-size:12px;color:#8b949e">無持倉</span>
  </div>
  <canvas id="chart"></canvas>
  <div id="posBox" style="display:none;margin-top:10px;padding:10px;background:#0d1117;border-radius:8px;border:1px solid var(--border)">
    <div class="flex">
      <span id="posDesc" style="font-weight:700"></span>
      <span id="posPnl" style="font-weight:800"></span>
    </div>
    <div style="font-size:11px;color:#8b949e;margin-top:4px">保證金安全度（歸零即強制平倉）</div>
    <div class="prog-bg"><div id="safetyBar" class="prog-bar" style="width:100%;background:#00e676"></div></div>
    <button class="btn-close" onclick="closePosition()">💰 立即市價平倉結算</button>
  </div>
  <div id="orderBox">
    <div class="lev-row">
      <button class="lev-btn active" onclick="setLev(1,this)">1x 現貨</button>
      <button class="lev-btn" onclick="setLev(5,this)">5x 槓桿</button>
      <button class="lev-btn" onclick="setLev(10,this)">10x 槓桿</button>
      <button class="lev-btn" onclick="setLev(20,this)">20x 極限</button>
    </div>
    <div class="btns">
      <button class="btn-long" onclick="openPosition('LONG')">📈 全倉做多 (看漲)</button>
      <button class="btn-short" onclick="openPosition('SHORT')">📉 全倉放空 (看跌)</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="flex">
    <strong>🏆 全球股神榜 (TOP 10)</strong>
    <button class="btn-sub" style="padding:4px 10px;font-size:12px" onclick="loadLeaderboard();loadAiLiveStatus()">🔄 刷新</button>
  </div>
  <div class="flex" style="margin-top:8px">
    <input id="playerName" placeholder="輸入你的大名上榜..." maxlength="14" style="flex:1">
    <button class="btn-sub" onclick="submitScore(true)">📤 手動上傳戰績</button>
  </div>
  <table>
    <thead><tr><th>#</th><th>玩家</th><th>段位</th><th>總淨值</th><th>報酬率</th></tr></thead>
    <tbody id="lbBody"><tr><td colspan="5" style="text-align:center;color:#8b949e">載入中...</td></tr></tbody>
  </table>
</div>

<script>
const SUPABASE_URL="https://mkdfrrmvchuovqafwyvd.supabase.co";
const SUPABASE_KEY="sb_publishable_HAlAC8PR6fT4sOKIttqqJw_jHdLECaj";
const STOCKS={
  "0050":{seed:101,name:"元大台灣50",base:195.0,vol:1.1},
  "2330":{seed:202,name:"台積電",base:1050.0,vol:1.7},
  "2454":{seed:303,name:"聯發科",base:1320.0,vol:2.3},
  "2317":{seed:404,name:"鴻海",base:215.0,vol:1.9},
  "3481":{seed:505,name:"群創",base:16.5,vol:3.4}
};
const NEWS_BIAS=[0.55,0.65,-0.55,-0.65,0.0];

function syncRand(t,s){const x=Math.sin(t*12.9898+s*78.233)*43758.5453;return x-Math.floor(x);}

// 公平競技版：取消固定周期，改用每 8 tick 全球同步偽隨機事件（無人能預知未來）
function getGlobalMarketState(t){
  const block=Math.floor(t/8);
  const ev=syncRand(block,777);
  if(ev<0.09)return{bias:-1.55,mode:"BLACK_SWAN",label:"🚨 突發黑天鵝閃崩"};
  if(ev>0.91)return{bias:1.55,mode:"SUPER_BULL",label:"🚀 央行突襲降息狂潮"};
  const idx=Math.floor(syncRand(block,999)*NEWS_BIAS.length);
  const b=NEWS_BIAS[idx];
  return{bias:b,mode:"NORMAL",label:b>0?"📈 市場偏多氛圍":b<0?"📉 市場偏空整理":"🌐 市場平穩波動"};
}

function getPriceAtTick(code,tick){
  const st=STOCKS[code],ep=Math.floor(tick/360)*360;
  let p=st.base;
  for(let t=ep;t<=tick;t++){
    const {bias}=getGlobalMarketState(t);
    const r=syncRand(t,st.seed);
    p=Math.max(2.0,p*(1+((r-0.5+bias*0.35)*st.vol)/100));
  }
  return p;
}

let state=JSON.parse(localStorage.getItem("qt_v6")||"null")||{cash:10000,pos:null,lev:1,sel:"3481",name:"",lastRename:0,dayKey:""};
const todayKey=new Date(Date.now()+8*3600*1000).toISOString().slice(0,10);
if(state.dayKey!==todayKey){state.cash=10000;state.pos=null;state.dayKey=todayKey;}
document.getElementById("playerName").value=state.name||"";
let prices={},history=[];

function saveState(){localStorage.setItem("qt_v6",JSON.stringify(state));}
function setLev(l,el){state.lev=l;document.querySelectorAll(".lev-btn").forEach(b=>b.classList.remove("active"));el.classList.add("active");saveState();}

function openPosition(dir){
  if(state.pos||state.cash<100)return;
  const p=prices[state.sel];
  state.pos={code:state.sel,dir,entry:p,margin:state.cash,lev:state.lev};
  state.cash=0;saveState();render();
}

function closePosition(){
  if(!state.pos)return;
  const p=prices[state.pos.code];
  const pnl=state.pos.margin*((p-state.pos.entry)/state.pos.entry)*state.pos.lev*(state.pos.dir==="LONG"?1:-1);
  state.cash=Math.max(0,state.pos.margin+pnl);
  state.pos=null;saveState();render();submitScore(false);
}

function getRankBadge(nw,name=""){
  if(String(name).trim().toLowerCase()==="ai")return{label:"🤖 官方量化AI",cls:"rank-buffett"};
  if(nw>=1e6)return{label:"💎 巴菲特本尊",cls:"rank-buffett"};
  if(nw>=5e5)return{label:"👑 少年股神",cls:"rank-god"};
  if(nw>=1e5)return{label:"🐺 華爾街之狼",cls:"rank-wolf"};
  if(nw>=3e4)return{label:"🔥 當沖大戶",cls:"rank-whale"};
  return{label:"🌱 菜鳥散戶",cls:"rank-rookie"};
}

let lastSubmit=0;
async function submitScore(manual){
  const rawName=document.getElementById("playerName").value.trim();
  if(!rawName){if(manual)alert("請先輸入玩家暱稱！");return;}
  if(rawName.toLowerCase()==="ai"){if(manual)alert("「ai」為官方量化機器人專用保留代號！");return;}
  if(rawName!=="7676"&&state.name&&state.name!==rawName&&Date.now()-state.lastRename<600000){
    if(manual)alert("每 10 分鐘僅能更改一次暱稱！");return;
  }
  if(state.name!==rawName){state.name=rawName;state.lastRename=Date.now();saveState();}
  const nw=calcNetWorth();
  if(nw<=10000&&!manual)return;
  if(!manual&&Date.now()-lastSubmit<15000)return;
  lastSubmit=Date.now();
  const roi=Number((((nw-10000)/10000)*100).toFixed(2));
  const h={"apikey":SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"};
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=*&player_name=eq.${encodeURIComponent(rawName)}&order=net_worth.desc&limit=1`,{headers:{"apikey":SUPABASE_KEY}});
    const rows=await res.json();
    if(rows&&rows.length>0){
      if(nw>Number(rows[0].net_worth)){
        await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?id=eq.${rows[0].id}`,{method:"PATCH",headers:h,body:JSON.stringify({net_worth:Math.round(nw),return_rate:roi,created_at:new Date().toISOString()})});
      }
    }else{
      await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`,{method:"POST",headers:h,body:JSON.stringify({player_name:rawName,net_worth:Math.round(nw),return_rate:roi})});
    }
    loadLeaderboard();
    if(manual)alert("✅ 戰績已同步至全球排行榜！");
  }catch(e){}
}

async function loadLeaderboard(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=*&order=net_worth.desc&limit=10`,{headers:{"apikey":SUPABASE_KEY}});
    const rows=await res.json();
    document.getElementById("lbBody").innerHTML=rows.map((r,i)=>{
      const nw=Number(r.net_worth),bg=getRankBadge(nw,r.player_name);
      return `<tr><td>${i+1}</td><td><strong>${r.player_name}</strong></td><td class="${bg.cls}">${bg.label}</td><td>$${nw.toLocaleString()}</td><td class="${r.return_rate>=0?'up':'down'}">${r.return_rate>=0?'+':''}${r.return_rate}%</td></tr>`;
    }).join("");
  }catch(e){}
}

// 讀取官方 AI 即時持倉並計算實時浮動損益
let aiCache=null;
async function loadAiLiveStatus(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/ai_live_status?id=eq.1&select=*`,{headers:{"apikey":SUPABASE_KEY}});
    const rows=await res.json();
    if(rows&&rows.length>0)aiCache=rows[0];
  }catch(e){}
}

function renderAiLiveBox(){
  if(!aiCache)return;
  const ageSec=(Date.now()-new Date(aiCache.updated_at).getTime())/1000;
  const online=ageSec<25;
  const tag=document.getElementById("aiOnlineTag");
  tag.textContent=online?"🟢 實盤連線操盤中":"⚪ 離線休眠中";
  tag.className="badge "+(online?"bg-down":"bg-ai");
  const box=document.getElementById("aiLiveDetail");
  if(!aiCache.direction||aiCache.direction==="NONE"){
    box.innerHTML=`目前狀態：<strong>空手觀望中（尋找均線動能訊號）</strong> ｜ 帳戶淨值：<strong style="color:#ffd700">$${Number(aiCache.net_worth).toLocaleString()}</strong>`;
  }else{
    const curP=prices[aiCache.stock_code]||Number(aiCache.entry_price);
    const entry=Number(aiCache.entry_price);
    const margin=Number(aiCache.margin);
    const lev=Number(aiCache.leverage);
    const pnl=margin*((curP-entry)/entry)*lev*(aiCache.direction==="LONG"?1:-1);
    const roi=(pnl/margin)*100;
    const dirTxt=aiCache.direction==="LONG"?`<span class="up">📈 做多 ${lev}x</span>`:`<span class="down">📉 放空 ${lev}x</span>`;
    box.innerHTML=`持有標的：<strong>${aiCache.stock_code} ${aiCache.stock_name}</strong> ｜ 方向：${dirTxt} ｜ 開倉價：<strong>${entry.toFixed(2)}</strong>（現價 ${curP.toFixed(2)}）<br>即時浮動損益：<strong class="${pnl>=0?'up':'down'}">${pnl>=0?'+':''}$${Math.round(pnl).toLocaleString()} (${roi>=0?'+':''}${roi.toFixed(1)}%)</strong> ｜ 總淨值：<strong style="color:#ffd700">$${Math.round(Number(aiCache.net_worth)+pnl).toLocaleString()}</strong>`;
  }
}

function calcNetWorth(){
  if(!state.pos)return state.cash;
  const p=prices[state.pos.code];
  const pnl=state.pos.margin*((p-state.pos.entry)/state.pos.entry)*state.pos.lev*(state.pos.dir==="LONG"?1:-1);
  return Math.max(0,state.cash+state.pos.margin+pnl);
}

function render(){
  const nw=calcNetWorth();
  document.getElementById("netWorth").textContent="$"+Math.round(nw).toLocaleString();
  document.getElementById("cashInfo").textContent="可用現金: $"+Math.round(state.cash).toLocaleString();

  document.getElementById("stockList").innerHTML=Object.keys(STOCKS).map(k=>{
    const p=prices[k]||STOCKS[k].base,prev=getPriceAtTick(k,lastTick-1);
    const diff=((p-prev)/prev)*100;
    return `<div class="stk ${state.sel===k?'active':''}" onclick="selectStock('${k}')">
      <div class="flex"><span style="font-weight:700">${k} ${STOCKS[k].name}</span><span class="${diff>=0?'up':'down'}" style="font-size:12px">${diff>=0?'+':''}${diff.toFixed(2)}%</span></div>
      <div class="price ${diff>=0?'up':'down'}">${p.toFixed(2)}</div>
    </div>`;
  }).join("");

  document.getElementById("chartTitle").textContent=`${state.sel} ${STOCKS[state.sel].name} · 即時走勢`;
  const posBox=document.getElementById("posBox"),orderBox=document.getElementById("orderBox");
  if(state.pos){
    posBox.style.display="block";orderBox.style.display="none";
    const p=prices[state.pos.code];
    const pnl=state.pos.margin*((p-state.pos.entry)/state.pos.entry)*state.pos.lev*(state.pos.dir==="LONG"?1:-1);
    const safety=Math.max(0,Math.min(100,((state.pos.margin+pnl)/state.pos.margin)*100));
    const liqP=state.pos.dir==="LONG"?state.pos.entry*(1-1/state.pos.lev):state.pos.entry*(1+1/state.pos.lev);
    document.getElementById("liqPriceTag").innerHTML=`強平預警價: <strong style="color:#ff4d4f">${liqP.toFixed(2)}</strong>`;
    document.getElementById("posDesc").innerHTML=`${state.pos.code} ${state.pos.dir==="LONG"?'📈做多':'📉放空'} ${state.pos.lev}x @ ${state.pos.entry.toFixed(2)}`;
    document.getElementById("posPnl").innerHTML=`<span class="${pnl>=0?'up':'down'}">${pnl>=0?'+':''}$${Math.round(pnl).toLocaleString()}</span>`;
    const bar=document.getElementById("safetyBar");
    bar.style.width=safety+"%";bar.style.background=safety>50?"#00e676":safety>25?"#ffd700":"#ff4d4f";
  }else{
    posBox.style.display="none";orderBox.style.display="block";
    document.getElementById("liqPriceTag").textContent="空手觀望中";
  }
  drawChart();renderAiLiveBox();
}

function selectStock(k){state.sel=k;history=[];for(let i=45;i>=0;i--)history.push(getPriceAtTick(k,lastTick-i));render();}

function drawChart(){
  const c=document.getElementById("chart"),ctx=c.getContext("2d");
  c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.scale(2,2);
  const w=c.clientWidth,h=c.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(history.length<2)return;
  const min=Math.min(...history)*0.998,max=Math.max(...history)*1.002;
  ctx.strokeStyle="#58a6ff";ctx.lineWidth=2;ctx.beginPath();
  history.forEach((v,i)=>{
    const x=(i/(history.length-1))*w,y=h-((v-min)/(max-min))*h;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();
}

let lastTick=-1;
setInterval(()=>{
  const tick=Math.floor(Date.now()/800);
  if(tick===lastTick)return;
  lastTick=tick;
  const ev=getGlobalMarketState(tick);
  const evEl=document.getElementById("marketEvent");
  evEl.textContent=ev.label;
  evEl.className="badge "+(ev.mode==="BLACK_SWAN"?"bg-up":ev.mode==="SUPER_BULL"?"bg-down":"bg-gold");

  Object.keys(STOCKS).forEach(k=>prices[k]=getPriceAtTick(k,tick));
  if(history.length===0){for(let i=45;i>=0;i--)history.push(getPriceAtTick(state.sel,tick-i));}
  else{history.push(prices[state.sel]);if(history.length>46)history.shift();}

  if(state.pos){
    const p=prices[state.pos.code];
    const pnl=state.pos.margin*((p-state.pos.entry)/state.pos.entry)*state.pos.lev*(state.pos.dir==="LONG"?1:-1);
    if(state.pos.margin+pnl<=0){
      alert(`💥 慘遭強制平倉！系統發放 $3,000 東山再起救濟金。`);
      state.pos=null;state.cash=3000;saveState();
    }
  }
  render();
  if(tick%20===0)submitScore(false);
  if(tick%6===0)loadAiLiveStatus();
},200);

loadLeaderboard();loadAiLiveStatus();
</script>
</body>
</html>
