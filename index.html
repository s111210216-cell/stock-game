<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 量化股市模擬交易終端</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@600;800&display=swap');

    body {
        background: #010409;
        margin: 0;
        padding: 16px;
        color: #e6edf3;
    }

    .terminal-box {
        font-family: 'Noto Sans TC', sans-serif;
        background: #0d1117;
        color: #e6edf3;
        max-width: 860px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 14px;
        border: 1px solid #30363d;
        box-shadow: 0 12px 35px rgba(0,0,0,0.75);
    }

    .top-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #21262d;
        padding-bottom: 12px;
        margin-bottom: 12px;
        gap: 10px;
    }

    .stock-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    .stock-tab {
        background: #161b22;
        border: 1px solid #30363d;
        color: #8b949e;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        transition: 0.2s;
    }
    .stock-tab:hover { border-color: #58a6ff; color: #e6edf3; }
    .stock-tab.active {
        background: #1f6feb;
        color: white;
        border-color: #58a6ff;
    }

    .sync-badge {
        font-size: 11px;
        background: rgba(31, 111, 235, 0.2);
        border: 1px solid rgba(88, 166, 255, 0.4);
        color: #58a6ff;
        padding: 2px 8px;
        border-radius: 6px;
        margin-left: 8px;
        vertical-align: middle;
    }

    .price-display {
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 800;
    }

    .up { color: #ff4d4f; }
    .down { color: #00e676; }

    .news-ticker {
        background: rgba(255, 193, 7, 0.1);
        border-left: 4px solid #ffc107;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 14px;
        color: #ffd54f;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .chart-wrapper {
        position: relative;
        background: #010409;
        border: 1px solid #21262d;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 12px;
    }

    canvas {
        width: 100%;
        height: 220px;
        display: block;
    }

    .ai-banner {
        display: none;
        background: linear-gradient(90deg, rgba(31, 111, 235, 0.25), rgba(138, 43, 226, 0.25));
        border: 1px solid #58a6ff;
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 12px;
        justify-content: space-between;
        align-items: center;
    }

    .ai-log-box {
        background: #010409;
        border: 1px solid #21262d;
        border-radius: 8px;
        padding: 8px 12px;
        font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
        font-size: 12px;
        color: #79c0ff;
        height: 62px;
        overflow-y: auto;
        margin-bottom: 12px;
    }

    .dashboard {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 12px;
    }

    @media (max-width: 600px) {
        .dashboard { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
        background: #161b22;
        border: 1px solid #30363d;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
    }

    .stat-label { font-size: 12px; color: #8b949e; margin-bottom: 4px; }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: bold; }

    .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        background: #161b22;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #30363d;
    }

    .lev-group { display: flex; gap: 6px; }
    .lev-btn {
        background: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
        padding: 7px 11px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
    }
    .lev-btn.active { background: #1f6feb; color: white; border-color: #58a6ff; }

    .trade-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
        border: none;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 900;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.15s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-long { background: #d32f2f; color: white; }
    .btn-short { background: #00a152; color: white; }
    .btn-close { background: #f57c00; color: white; }
    .btn-ai { background: linear-gradient(90deg, #00b4db, #0083b0); color: white; box-shadow: 0 0 12px rgba(0, 180, 219, 0.4); }
    .btn-gacha { background: linear-gradient(90deg, #8e2de2, #4a00e0); color: white; }
    .btn-rank { background: linear-gradient(90deg, #f59e0b, #d97706); color: #0d1117; }

    .items-bar {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        background: #161b22;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px dashed #8a2be2;
    }

    .inventory-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .item-tag {
        background: rgba(138, 43, 226, 0.25);
        border: 1px solid #a371f7;
        color: #d2a8ff;
        padding: 5px 10px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        font-weight: bold;
    }

    .leaderboard-panel {
        margin-top: 14px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 14px;
    }

    .lb-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid #21262d;
    }

    .lb-submit-box {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
    }

    .lb-input {
        background: #0d1117;
        border: 1px solid #30363d;
        color: #e6edf3;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
        font-family: 'Noto Sans TC', sans-serif;
        width: 150px;
    }
    .lb-input:focus {
        outline: none;
        border-color: #f59e0b;
    }

    .lb-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }

    .lb-table th {
        text-align: left;
        color: #8b949e;
        padding: 8px;
        border-bottom: 1px solid #30363d;
    }

    .lb-table td {
        padding: 8px;
        border-bottom: 1px solid #21262d;
        font-family: 'JetBrains Mono', 'Noto Sans TC', monospace;
    }

    .lb-table tr:hover {
        background: rgba(255, 255, 255, 0.03);
    }
</style>
</head>
<body>

<div class="terminal-box">
    <div class="stock-tabs" id="stock-tabs"></div>

    <div class="top-bar">
        <div>
            <span id="stock-header" style="font-size: 20px; font-weight: 900;">0050 元大台灣50</span>
            <span id="stock-desc" style="font-size: 12px; color: #8b949e; margin-left: 8px;">穩健大盤指數</span>
            <span class="sync-badge">🌐 全球即時同步盤</span>
        </div>
        <div>
            <span id="price-val" class="price-display up">195.00</span>
            <span id="pct-val" class="up" style="font-family: 'JetBrains Mono'; font-size: 14px; margin-left: 6px;">(+0.00%)</span>
        </div>
    </div>

    <div class="news-ticker">
        <span id="news-text">📢 全球市場連線同步中...</span>
        <span id="insider-hint" style="color: #58a6ff; font-weight: bold;"></span>
    </div>

    <div class="ai-banner" id="ai-banner">
        <span style="font-weight: 900; color: #79c0ff;">🤖 量化 AI 自動代操接管中... 剩餘 <span id="ai-timer" style="font-size: 18px; color: #ffd700;">30</span> 秒</span>
        <button class="btn" style="background: #da3633; color: white; padding: 5px 12px; font-size: 12px;" onclick="stopAI(true)">手動中止代操</button>
    </div>

    <div class="chart-wrapper">
        <canvas id="stockCanvas" width="800" height="220"></canvas>
    </div>

    <div class="ai-log-box" id="ai-log">
        <div>> [全球同步盤就緒] 所有玩家的股價走勢、K線與突發新聞已透過世界標準時間完全同步！</div>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <div class="stat-label">可用現金</div>
            <div class="stat-value" id="cash-val" style="color: #ffd700;">$10,000</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">目前倉位</div>
            <div class="stat-value" id="pos-val">空手觀望</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">進場均價</div>
            <div class="stat-value" id="entry-val">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">未實現損益</div>
            <div class="stat-value" id="pnl-val">$0</div>
        </div>
    </div>

    <div class="controls-row">
        <div class="lev-group">
            <button class="lev-btn active" onclick="setLev(1, this)">1x 現貨</button>
            <button class="lev-btn" onclick="setLev(5, this)">5x 融資</button>
            <button class="lev-btn" onclick="setLev(20, this)">20x 飆車</button>
        </div>

        <div class="trade-btns">
            <button class="btn btn-ai" id="btn-ai" onclick="startAI()">🤖 電腦 AI 代操 30 秒</button>
            <button class="btn btn-long" id="btn-long" onclick="openPosition('LONG')">🔴 做多</button>
            <button class="btn btn-short" id="btn-short" onclick="openPosition('SHORT')">🟢 放空</button>
            <button class="btn btn-close" id="btn-close" onclick="closePosition()" disabled>💰 平倉</button>
        </div>
    </div>

    <div class="items-bar">
        <div>
            <button class="btn btn-gacha" onclick="drawBox()">🎁 抽操盤手盲盒 ($2,000)</button>
            <span style="font-size: 12px; color: #8b949e; margin-left: 8px;">點擊道具使用：</span>
        </div>
        <div class="inventory-tags" id="items-list">
            <span style="font-size: 12px; color: #6e7681;">(尚無道具)</span>
        </div>
    </div>

    <div class="leaderboard-panel">
        <div class="lb-header">
            <div>
                <span style="font-size: 16px; font-weight: 900; color: #ffd700;">🏆 全球即時股神排行榜 (TOP 10)</span>
                <span id="networth-preview" style="font-size: 12px; color: #8b949e; margin-left: 8px;">目前總淨值：$10,000</span>
            </div>
            <div class="lb-submit-box">
                <input type="text" id="player-name" class="lb-input" placeholder="輸入操盤手暱稱..." maxlength="16">
                <button class="btn btn-rank" id="btn-submit-score" onclick="submitScore()">🚀 上傳戰績</button>
                <button class="btn" style="background: #21262d; color: #c9d1d9; padding: 9px 12px;" onclick="loadLeaderboard()">🔄 刷新</button>
            </div>
        </div>

        <table class="lb-table">
            <thead>
                <tr>
                    <th style="width: 65px;">排名</th>
                    <th>操盤手暱稱</th>
                    <th style="text-align: right;">總資產淨值</th>
                    <th style="text-align: right;">總報酬率</th>
                    <th style="text-align: right;">上榜時間</th>
                </tr>
            </thead>
            <tbody id="lb-body">
                <tr><td colspan="5" style="text-align: center; color: #8b949e; padding: 16px;">正在連線至全球雲端排行榜...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://mkdfrrmvchuovqafwyvd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HAlAC8PR6fT4sOKIttqqJw_jHdLECaj";

    const canvas = document.getElementById('stockCanvas');
    const ctx = canvas.getContext('2d');

    const stocks = {
        "0050": { code: "0050", seed: 101, name: "元大台灣50", desc: "穩健大盤指數 (低波動)", base: 195.00, price: 195.00, vol: 1.1, history: [] },
        "2330": { code: "2330", seed: 202, name: "台積電", desc: "護國神山權值王 (中波動)", base: 1050.00, price: 1050.00, vol: 1.7, history: [] },
        "2454": { code: "2454", seed: 303, name: "聯發科", desc: "AI 晶片旗艦 (中高波動)", base: 1320.00, price: 1320.00, vol: 2.3, history: [] },
        "2317": { code: "2317", seed: 404, name: "鴻海", desc: "AI 伺服器代工龍頭 (中波動)", base: 215.00, price: 215.00, vol: 1.9, history: [] },
        "3481": { code: "3481", seed: 505, name: "群創", desc: "面板主力飆股 (極高波動)", base: 16.50, price: 16.50, vol: 3.4, history: [] }
    };

    const newsEvents = [
        { text: "🔥 利多：AI 伺服器與晶片訂單爆滿，外資大舉買超！", bias: 0.55 },
        { text: "🚀 利多：法人調升目標價，主力大單連續敲進！", bias: 0.65 },
        { text: "❄️ 利空：美股科技股重挫，外資提款賣超！", bias: -0.55 },
        { text: "💥 利空：供應鏈傳砍單雜音，停損賣壓湧現！", bias: -0.65 },
        { text: "⚖️ 盤整：市場觀望總經數據，多空狹幅震盪。", bias: 0.0 }
    ];

    function syncRand(tick, salt) {
        let x = Math.sin(tick * 12.9898 + salt * 78.233) * 43758.5453;
        return x - Math.floor(x);
    }

    function getGlobalMarketState(tick) {
        const block = Math.floor(tick / 10);
        return newsEvents[Math.floor(syncRand(block, 999) * newsEvents.length)];
    }

    function computePriceAtTick(st, tick) {
        const epochStart = Math.floor(tick / 360) * 360;
        let p = st.base;
        for (let t = epochStart; t <= tick; t++) {
            const ev = getGlobalMarketState(t);
            const r = syncRand(t, st.seed);
            const move = ((r - 0.5 + ev.bias * 0.35) * st.vol) / 100;
            p = Math.max(2, p * (1 + move));
        }
        return p;
    }

    const INITIAL_CAPITAL = 10000;
    let currentStockKey = "0050";
    let cash = INITIAL_CAPITAL;
    let leverage = 1;

    let position = null;
    let entryPrice = 0;
    let investedCash = 0;
    let shieldActive = false;

    let items = [];
    let aiActive = false;
    let aiSecondsLeft = 0;
    let aiCountdownInterval = null;
    let aiStartEquity = 0;

    let lastProcessedTick = -1;
    let vipDrift = 0;

    const savedName = localStorage.getItem('stock_game_player_name');
    if (savedName) {
        document.getElementById('player-name').value = savedName;
    }

    function isVipPlayer() {
        return document.getElementById('player-name').value.trim() === '7676';
    }

    function getTotalNetWorth() {
        if (!position) return Math.round(cash);
        return Math.max(0, Math.round(cash + investedCash + calcPnL()));
    }

    function logAI(msg) {
        const box = document.getElementById('ai-log');
        const line = document.createElement('div');
        line.innerText = `> ${msg}`;
        box.prepend(line);
        if (box.children.length > 15) box.removeChild(box.lastChild);
    }

    function renderStockTabs() {
        const container = document.getElementById('stock-tabs');
        container.innerHTML = Object.keys(stocks).map(k => {
            const s = stocks[k];
            const activeClass = k === currentStockKey ? 'active' : '';
            return `<button class="stock-tab ${activeClass}" onclick="selectStock('${k}')">${s.code} ${s.name}</button>`;
        }).join('');
    }

    function selectStock(key) {
        if (position) {
            alert("目前有持倉部位，請先平倉後再切換股票！");
            return;
        }
        currentStockKey = key;
        vipDrift = 0;
        const s = stocks[key];
        document.getElementById('stock-header').innerText = `${s.code} ${s.name}`;
        document.getElementById('stock-desc').innerText = s.desc;
        renderStockTabs();
        drawChart();
        updateUI();
    }

    function setLev(val, btn) {
        if (position || aiActive) {
            alert("持倉中或 AI 代操期間無法手動切換槓桿！");
            return;
        }
        leverage = val;
        document.querySelectorAll('.lev-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function openPosition(type, isByAI = false) {
        if (cash < 100) {
            if (!isByAI) alert("本金不足！系統發放 $3,000 救濟金！");
            cash = 3000;
        }
        position = type;
        entryPrice = stocks[currentStockKey].price;
        investedCash = cash;
        cash = 0;

        syncActionButtons();
        updateUI();
    }

    function closePosition() {
        if (!position) return;
        const pnl = calcPnL();
        cash = Math.max(0, Math.round(investedCash + pnl));
        position = null;
        entryPrice = 0;
        investedCash = 0;
        shieldActive = false;

        syncActionButtons();
        updateUI();
    }

    function syncActionButtons() {
        document.getElementById('btn-long').disabled = !!position || aiActive;
        document.getElementById('btn-short').disabled = !!position || aiActive;
        document.getElementById('btn-close').disabled = !position || aiActive;
        document.getElementById('btn-ai').disabled = aiActive;
    }

    function startAI() {
        if (aiActive || position) {
            alert("請先平倉目前部位再啟動 AI 代操！");
            return;
        }
        if (cash < 100) cash = 3000;

        aiActive = true;
        aiSecondsLeft = 30;
        aiStartEquity = cash;

        document.getElementById('ai-banner').style.display = 'flex';
        document.getElementById('ai-timer').innerText = aiSecondsLeft;
        syncActionButtons();

        logAI(`[AI 啟動] 量化演算法接管帳戶！初始資金 $${aiStartEquity.toLocaleString()}`);

        aiCountdownInterval = setInterval(() => {
            aiSecondsLeft--;
            document.getElementById('ai-timer').innerText = aiSecondsLeft;
            if (aiSecondsLeft <= 0) {
                stopAI(false);
            }
        }, 1000);
    }

    function stopAI(manual) {
        if (!aiActive) return;
        clearInterval(aiCountdownInterval);
        if (position) closePosition();

        aiActive = false;
        document.getElementById('ai-banner').style.display = 'none';
        syncActionButtons();

        const profit = cash - aiStartEquity;
        const sign = profit >= 0 ? "+" : "";
        logAI(`[AI 結束] ${manual ? "手動中止" : "30秒期滿"}！結算資金 $${cash.toLocaleString()} (${sign}$${profit.toLocaleString()})`);
    }

    function runAIStrategy(globalBias) {
        const s = stocks[currentStockKey];
        const h = s.history;
        const n = h.length;
        if (n < 6) return;

        const shortMA = (h[n-1] + h[n-2] + h[n-3]) / 3;
        const longMA = (h[n-4] + h[n-5] + h[n-6]) / 3;
        const momentum = (shortMA - longMA) / longMA;
        const vip = isVipPlayer();
        const signal = vip ? (momentum * 140 + globalBias * 1.3) : (momentum * 100 + globalBias * 0.8);

        if (!position) {
            const entryThreshold = vip ? 0.15 : 0.25;
            if (signal > entryThreshold) {
                leverage = vip ? (signal > 0.35 ? 20 : 5) : (signal > 0.6 ? 5 : 1);
                updateLevButtonsUI();
                openPosition('LONG', true);
                logAI(`[AI 進場做多] ${s.code} ${leverage}x @ ${s.price.toFixed(2)}`);
            } else if (signal < -entryThreshold) {
                leverage = vip ? (signal < -0.35 ? 20 : 5) : (signal < -0.6 ? 5 : 1);
                updateLevButtonsUI();
                openPosition('SHORT', true);
                logAI(`[AI 進場放空] ${s.code} ${leverage}x @ ${s.price.toFixed(2)}`);
            }
        } else {
            const pnl = calcPnL();
            const roi = pnl / investedCash;
            const takeProfit = vip ? 0.14 : 0.08;
            const stopLoss = vip ? -0.025 : -0.06;

            if (roi >= takeProfit) {
                closePosition();
                logAI(`[AI 停利出場] 獲利 +$${Math.round(pnl).toLocaleString()} (+${(roi*100).toFixed(1)}%)`);
            } else if (roi <= stopLoss) {
                closePosition();
                logAI(`[AI 停損風控] 虧損 -$${Math.abs(Math.round(pnl)).toLocaleString()} (${(roi*100).toFixed(1)}%)`);
            } else if ((position === 'LONG' && signal < -0.2) || (position === 'SHORT' && signal > 0.2)) {
                closePosition();
                logAI(`[AI 趨勢反轉平倉] 結算 $${Math.round(pnl).toLocaleString()}`);
            }
        }
    }

    function updateLevButtonsUI() {
        document.querySelectorAll('.lev-btn').forEach(b => {
            b.classList.toggle('active', b.innerText.startsWith(leverage + 'x'));
        });
    }

    function calcPnL() {
        if (!position) return 0;
        const currPrice = stocks[currentStockKey].price;
        const pctChange = (currPrice - entryPrice) / entryPrice;
        const direction = position === 'LONG' ? 1 : -1;
        return investedCash * pctChange * leverage * direction;
    }

    function drawBox() {
        if (cash < 2000) {
            alert("可用現金不足 $2,000，無法開啟盲盒！");
            return;
        }
        cash -= 2000;
        const r = isVipPlayer() ? (Math.random() * 0.55 + 0.45) : Math.random();
        if (r < 0.35) {
            items.push({ name: "🔮 內線消息卡", type: "INSIDER" });
            alert("抽中【🔮 內線消息卡】！可預知下一波全球大盤新聞。");
        } else if (r < 0.70) {
            items.push({ name: "🛡️ 防爆倉護身符", type: "SHIELD" });
            alert("抽中【🛡️ 防爆倉護身符】！爆倉時可保住 80% 本金。");
        } else {
            cash += 5000;
            alert("🎉 頭獎！抽中【💰 大戶空投支票】，現金直接 +$5,000！");
        }
        renderItems();
        updateUI();
    }

    function useItem(idx) {
        const item = items.splice(idx, 1)[0];
        if (item.type === "INSIDER") {
            const nextEv = getGlobalMarketState(lastProcessedTick + 10);
            document.getElementById('insider-hint').innerText = `🤫 內線預知下一波：${nextEv.text.slice(0, 14)}...`;
            setTimeout(() => document.getElementById('insider-hint').innerText = "", 7500);
        } else if (item.type === "SHIELD") {
            shieldActive = true;
            alert("🛡️ 防爆倉護身符已啟動！下一次面臨爆倉時將自動護盤。");
        }
        renderItems();
    }

    function renderItems() {
        const list = document.getElementById('items-list');
        if (items.length === 0) {
            list.innerHTML = `<span style="font-size: 12px; color: #6e7681;">(尚無道具)</span>`;
            return;
        }
        list.innerHTML = items.map((it, i) =>
            `<span class="item-tag" onclick="useItem(${i})">${it.name}</span>`
        ).join('');
    }

    function updateUI() {
        const s = stocks[currentStockKey];
        const prev = s.history[s.history.length - 2] || s.price;
        const pct = ((s.price - prev) / prev) * 100;

        const priceEl = document.getElementById('price-val');
        const pctEl = document.getElementById('pct-val');
        priceEl.innerText = s.price.toFixed(2);
        pctEl.innerText = `(${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)`;
        priceEl.className = `price-display ${pct >= 0 ? 'up' : 'down'}`;
        pctEl.className = pct >= 0 ? 'up' : 'down';

        document.getElementById('cash-val').innerText = `$${cash.toLocaleString()}`;
        document.getElementById('networth-preview').innerText = `目前總淨值：$${getTotalNetWorth().toLocaleString()}`;

        if (position) {
            const prefix = aiActive ? "🤖 " : "";
            document.getElementById('pos-val').innerText = `${prefix}${position === 'LONG' ? '做多' : '放空'} ${leverage}x ${shieldActive ? '🛡️' : ''}`;
            document.getElementById('pos-val').style.color = position === 'LONG' ? '#ff4d4f' : '#00e676';
            document.getElementById('entry-val').innerText = entryPrice.toFixed(2);

            const pnl = Math.round(calcPnL());
            const pnlEl = document.getElementById('pnl-val');
            pnlEl.innerText = `${pnl >= 0 ? '+' : ''}$${pnl.toLocaleString()}`;
            pnlEl.style.color = pnl >= 0 ? '#ff4d4f' : '#00e676';

            if (investedCash + pnl <= 0) {
                if (isVipPlayer()) {
                    entryPrice = s.price * (position === 'LONG' ? 0.992 : 1.008);
                } else if (shieldActive) {
                    cash = Math.round(investedCash * 0.8);
                    position = null;
                    shieldActive = false;
                    syncActionButtons();
                    alert("🛡️ 防爆倉護身符發動！已為您保留 80% 本金！");
                } else {
                    position = null;
                    investedCash = 0;
                    syncActionButtons();
                    if (!aiActive) alert("💥 槓桿倍數過高，慘遭斷頭爆倉！");
                }
            }
        } else {
            document.getElementById('pos-val').innerText = aiActive ? "🤖 AI 觀察中" : "空手觀望";
            document.getElementById('pos-val').style.color = "#8b949e";
            document.getElementById('entry-val').innerText = "-";
            document.getElementById('pnl-val').innerText = "$0";
            document.getElementById('pnl-val').style.color = "#e6edf3";
        }
    }

    function drawChart() {
        const h = stocks[currentStockKey].history;
        const w = canvas.width;
        const ch = canvas.height;
        if (h.length < 2) return;
        ctx.clearRect(0, 0, w, ch);

        const minP = Math.min(...h) * 0.996;
        const maxP = Math.max(...h) * 1.004;
        const range = maxP - minP || 1;

        ctx.strokeStyle = "#161b22";
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
            const y = (ch / 4) * i;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        const isUp = h[h.length - 1] >= h[h.length - 2];
        const lineColor = isUp ? "#ff4d4f" : "#00e676";

        ctx.beginPath();
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 3;
        h.forEach((val, idx) => {
            const x = (idx / (h.length - 1)) * w;
            const y = ch - ((val - minP) / range) * (ch - 30) - 15;
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        ctx.lineTo(w, ch);
        ctx.lineTo(0, ch);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, 0, 0, ch);
        grad.addColorStop(0, isUp ? "rgba(255, 77, 79, 0.28)" : "rgba(0, 230, 118, 0.28)");
        grad.addColorStop(1, "rgba(13, 17, 23, 0)");
        ctx.fillStyle = grad;
        ctx.fill();
    }

    let lastSubmitTime = 0;

    async function loadLeaderboard() {
        const tbody = document.getElementById('lb-body');
        try {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard?select=*&net_worth=gt.10000&order=net_worth.desc&limit=50`, {
                headers: { 'apikey': SUPABASE_KEY }
            });
            if (!res.ok) throw new Error('讀取排行榜失敗');
            const rawData = await res.json();

            const uniqueMap = new Map();
            (rawData || []).forEach(row => {
                const key = String(row.player_name || '').trim().toLowerCase();
                if (key && !uniqueMap.has(key)) {
                    uniqueMap.set(key, row);
                }
            });
            const data = Array.from(uniqueMap.values()).slice(0, 10);

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #8b949e; padding: 16px;">目前尚無獲利玩家上榜，快成為第一位股神！</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((row, idx) => {
                let rankDisplay = `#${idx + 1}`;
                if (idx === 0) rankDisplay = `🥇 1`;
                else if (idx === 1) rankDisplay = `🥈 2`;
                else if (idx === 2) rankDisplay = `🥉 3`;

                const roi = Number(row.return_rate);
                const roiColor = roi >= 0 ? '#ff4d4f' : '#00e676';
                const roiSign = roi >= 0 ? '+' : '';
                const dateObj = new Date(row.created_at);
                const timeStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${String(dateObj.getHours()).padStart(2,'0')}:${String(dateObj.getMinutes()).padStart(2,'0')}`;

                return `
                    <tr>
                        <td><strong>${rankDisplay}</strong></td>
                        <td style="font-family: 'Noto Sans TC', sans-serif; font-weight: bold;">${escapeHtml(row.player_name)}</td>
                        <td style="text-align: right; color: #ffd700; font-weight: bold;">$${Number(row.net_worth).toLocaleString()}</td>
                        <td style="text-align: right; color: ${roiColor};">${roiSign}${roi.toFixed(1)}%</td>
                        <td style="text-align: right; color: #8b949e; font-size: 12px;">${timeStr}</td>
                    </tr>
                `;
            }).join('');
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ff4d4f; padding: 16px;">⚠️ 連線失敗：${err.message}</td></tr>`;
        }
    }

    async function submitScore() {
        const now = Date.now();
        if (now - lastSubmitTime < 15000) {
            const waitSec = Math.ceil((15000 - (now - lastSubmitTime)) / 1000);
            alert(`操作太頻繁，請等待 ${waitSec} 秒後再上傳戰績！`);
            return;
        }

        const nameInput = document.getElementById('player-name');
        const playerName = nameInput.value.replace(/\s+/g, ' ').trim();
        if (!playerName || playerName.length < 1) {
            alert("請先輸入您的操盤手暱稱再上傳戰績！");
            nameInput.focus();
            return;
        }

        // 每 10 分鐘只能更改一次暱稱（7676 除外）
        const lockedName = localStorage.getItem('stock_game_locked_name');
        const lockedTime = Number(localStorage.getItem('stock_game_locked_time') || 0);
        const RENAME_COOLDOWN = 10 * 60 * 1000;

        if (playerName !== '7676' && lockedName && lockedName !== playerName && (now - lockedTime < RENAME_COOLDOWN)) {
            const remainMs = RENAME_COOLDOWN - (now - lockedTime);
            const remainMin = Math.floor(remainMs / 60000);
            const remainSec = Math.ceil((remainMs % 60000) / 1000);
            alert(`⏳ 每 10 分鐘只能更改一次暱稱！\n目前鎖定暱稱：「${lockedName}」\n請等待 ${remainMin} 分 ${remainSec} 秒後再改名，或繼續使用「${lockedName}」更新戰績。`);
            nameInput.value = lockedName;
            return;
        }

        const currentNetWorth = getTotalNetWorth();
        if (currentNetWorth <= INITIAL_CAPITAL) {
            alert("總淨值必須超過初始本金 $10,000 才能登上全球股神榜！");
            return;
        }
        if (currentNetWorth > 999999999) {
            alert("數值異常，無法上傳！");
            return;
        }

        const returnRate = Number((((currentNetWorth - INITIAL_CAPITAL) / INITIAL_CAPITAL) * 100).toFixed(2));
        const btn = document.getElementById('btn-submit-score');
        btn.disabled = true;
        btn.innerText = "檢查榜單...";

        try {
            // 查詢資料庫是否已存在同名玩家，同名只保留最高分
            const checkRes = await fetch(
                `${SUPABASE_URL}/rest/v1/leaderboard?select=*&player_name=eq.${encodeURIComponent(playerName)}&order=net_worth.desc&limit=1`,
                { headers: { 'apikey': SUPABASE_KEY } }
            );
            const existing = await checkRes.json();

            if (existing && existing.length > 0) {
                const bestRecord = existing[0];
                if (currentNetWorth <= Number(bestRecord.net_worth)) {
                    alert(`排行榜上「${playerName}」的最高紀錄為 $${Number(bestRecord.net_worth).toLocaleString()}，本次戰績 ($${currentNetWorth.toLocaleString()}) 未破紀錄，不重複覆蓋！`);
                    return;
                }

                btn.innerText = "刷新紀錄中...";
                const patchRes = await fetch(
                    `${SUPABASE_URL}/rest/v1/leaderboard?id=eq.${bestRecord.id}`,
                    {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({
                            net_worth: currentNetWorth,
                            return_rate: returnRate,
                            created_at: new Date().toISOString()
                        })
                    }
                );

                if (!patchRes.ok) {
                    await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({
                            player_name: playerName,
                            net_worth: currentNetWorth,
                            return_rate: returnRate
                        })
                    });
                }
            } else {
                btn.innerText = "上傳中...";
                const postRes = await fetch(`${SUPABASE_URL}/rest/v1/leaderboard`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        player_name: playerName,
                        net_worth: currentNetWorth,
                        return_rate: returnRate
                    })
                });
                if (!postRes.ok) throw new Error('寫入資料庫失敗');
            }

            localStorage.setItem('stock_game_player_name', playerName);
            if (!lockedName || lockedName !== playerName) {
                localStorage.setItem('stock_game_locked_name', playerName);
                localStorage.setItem('stock_game_locked_time', String(Date.now()));
            }
            lastSubmitTime = Date.now();

            logAI(`[全球排行] ${playerName} 成功刷新最高戰績：$${currentNetWorth.toLocaleString()} (${returnRate >= 0 ? '+' : ''}${returnRate}%)`);
            await loadLeaderboard();
        } catch (err) {
            alert("上傳失敗，請稍後再試：" + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "🚀 上傳戰績";
        }
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    setInterval(loadLeaderboard, 15000);

    function syncTickLoop() {
        const currentTick = Math.floor(Date.now() / 800);
        if (currentTick === lastProcessedTick) return;
        lastProcessedTick = currentTick;

        const ev = getGlobalMarketState(currentTick);
        document.getElementById('news-text').innerText = ev.text;

        const vip = isVipPlayer();
        Object.keys(stocks).forEach(k => {
            const st = stocks[k];
            if (st.history.length === 0) {
                for (let i = 59; i >= 0; i--) {
                    st.history.push(computePriceAtTick(st, currentTick - i));
                }
            } else {
                st.history.push(computePriceAtTick(st, currentTick));
                if (st.history.length > 60) st.history.shift();
            }

            let syncedPrice = st.history[st.history.length - 1];
            if (vip && k === currentStockKey && position) {
                vipDrift += (position === 'LONG' ? 0.0022 : -0.0022);
                syncedPrice = Math.max(2, syncedPrice * (1 + vipDrift));
                st.history[st.history.length - 1] = syncedPrice;
            }
            st.price = syncedPrice;
        });

        if (aiActive) runAIStrategy(ev.bias);
        drawChart();
        updateUI();
    }

    renderStockTabs();
    syncTickLoop();
    loadLeaderboard();
    setInterval(syncTickLoop, 200);
</script>
