<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 量化股市模擬交易終端</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@600;800&display=swap');
*{box-sizing:border-box}
html,body{background:#010409;margin:0;padding:10px;color:#e6edf3;overflow-x:hidden;width:100%}
.terminal-box{font-family:'Noto Sans TC',sans-serif;background:#0d1117;max-width:860px;width:100%;margin:0 auto;padding:16px;border-radius:14px;border:1px solid #30363d;box-shadow:0 12px 35px rgba(0,0,0,.75);transition:.2s}
@keyframes shakeAnim{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-8px)}30%,60%,90%{transform:translateX(8px)}}
@keyframes pulseDanger{0%,100%{opacity:1}50%{opacity:.4}}
.shake-crash{animation:shakeAnim .45s ease-in-out;border-color:#ff4d4f!important;box-shadow:0 0 30px rgba(255,77,79,.65)!important}
.top-bar,.stock-tabs,.ai-banner,.controls-row,.items-bar,.lb-header,.liq-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.top-bar{border-bottom:1px solid #21262d;padding-bottom:10px;margin-bottom:10px}
.stock-tabs{margin-bottom:10px}
.stock-tabs-left,.header-utils,.lev-group,.trade-btns,.inventory-tags,.lb-submit-box,.ai-banner-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stock-tab,.lev-btn,.sound-btn{background:#161b22;border:1px solid #30363d;color:#c9d1d9;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s}
.stock-tab{color:#8b949e}
.stock-tab:hover,.sound-btn:hover{border-color:#58a6ff;color:#e6edf3}
.stock-tab.active,.lev-btn.active{background:#1f6feb;color:#fff;border-color:#58a6ff}
.daily-reset-badge,.sync-badge{font-size:11px;padding:3px 8px;border-radius:6px;font-family:'JetBrains Mono','Noto Sans TC',monospace}
.daily-reset-badge{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#34d399}
.sync-badge{background:rgba(31,111,235,.2);border:1px solid rgba(88,166,255,.4);color:#58a6ff;margin-left:6px}
.rank-badge{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;margin-left:6px}
.rank-rookie{background:rgba(139,148,158,.2);color:#c9d1d9;border:1px solid #6e7681}
.rank-whale{background:rgba(245,158,11,.2);color:#fbbf24;border:1px solid #f59e0b}
.rank-wolf{background:rgba(239,68,68,.22);color:#f87171;border:1px solid #ef4444}
.rank-god{background:linear-gradient(90deg,rgba(168,85,247,.3),rgba(236,72,153,.3));color:#f472b6;border:1px solid #e879f9}
.rank-buffett{background:linear-gradient(90deg,#ffd700,#f59e0b);color:#0d1117;border:1px solid #fef08a;box-shadow:0 0 10px rgba(255,215,0,.45)}
.price-display{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:800}
.up{color:#ff4d4f}.down{color:#00e676}
.news-ticker{background:rgba(255,193,7,.1);border-left:4px solid #ffc107;padding:8px 12px;border-radius:4px;font-size:13px;color:#ffd54f;margin-bottom:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.news-blackswan{background:rgba(239,68,68,.22)!important;border-left-color:#ff4d4f!important;color:#ff8080!important;font-weight:900}
.news-superbull{background:rgba(16,185,129,.2)!important;border-left-color:#00e676!important;color:#6ee7b7!important;font-weight:900}
.chart-wrapper,.ai-log-box{background:#010409;border:1px solid #21262d;border-radius:10px;margin-bottom:10px}
.chart-wrapper{padding:8px}
canvas{width:100%;height:205px;display:block}
.ai-banner{display:none;background:linear-gradient(90deg,rgba(31,111,235,.25),rgba(138,43,226,.25));border:1px solid #58a6ff;padding:9px 12px;border-radius:8px;margin-bottom:10px}
.ai-log-box{padding:8px 12px;font-family:'JetBrains Mono','Noto Sans TC',monospace;font-size:12px;line-height:1.5;color:#79c0ff;height:72px;overflow-y:auto}
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat-card,.liq-warning-box,.controls-row,.items-bar,.leaderboard-panel{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px 12px}
.stat-card{text-align:center;border-radius:8px;padding:9px 6px}
.stat-label{font-size:12px;color:#8b949e;margin-bottom:3px}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
.liq-warning-box{display:none;margin-bottom:10px;border-radius:8px}
.liq-bar-bg{width:100%;height:8px;background:#010409;border-radius:999px;overflow:hidden;margin-top:5px}
.liq-bar-fill{height:100%;width:100%;background:#00e676;transition:.25s}
.liq-danger-blink{animation:pulseDanger .6s infinite}
.btn{border:none;padding:9px 14px;font-size:14px;font-weight:900;border-radius:8px;cursor:pointer;transition:.15s;touch-action:manipulation}
.btn:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-long{background:#d32f2f;color:#fff}.btn-short{background:#00a152;color:#fff}.btn-close{background:#f57c00;color:#fff}
.btn-ai{background:linear-gradient(90deg,#00b4db,#0083b0);color:#fff}
.btn-gacha{background:linear-gradient(90deg,#8e2de2,#4a00e0);color:#fff}
.btn-rank{background:linear-gradient(90deg,#f59e0b,#d97706);color:#0d1117}
.items-bar{margin-top:10px;border-style:dashed;border-color:#8a2be2}
.item-tag{background:rgba(138,43,226,.25);border:1px solid #a371f7;color:#d2a8ff;padding:5px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:700}
.leaderboard-panel{margin-top:12px}
.lb-header{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #21262d}
.lb-input{background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:8px 10px;border-radius:8px;font-size:14px;width:145px}
.lb-input:focus{outline:none;border-color:#f59e0b}
.lb-table-wrap{width:100%;overflow-x:auto}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table th{text-align:left;color:#8b949e;padding:7px 5px;border-bottom:1px solid #30363d;white-space:nowrap}
.lb-table td{padding:7px 5px;border-bottom:1px solid #21262d;font-family:'JetBrains Mono','Noto Sans TC',monospace}
.receipt-overlay{display:none;position:fixed;inset:0;background:rgba(1,4,9,.78);z-index:9999;justify-content:center;align-items:center;padding:16px}
.receipt-card{background:#161b22;border:1px solid #30363d;border-radius:14px;max-width:350px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.85)}
.receipt-title{font-size:17px;font-weight:900;text-align:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px dashed #30363d}
.receipt-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:#c9d1d9}
.receipt-row span:last-child{font-family:'JetBrains Mono',monospace;font-weight:700}
@media(max-width:640px){
  html,body{padding:6px}.terminal-box{padding:11px}
  .stock-tabs-left{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
  .stock-tab{padding:8px 4px;font-size:12px;text-align:center}
  .header-utils,.lev-group,.trade-btns,.lb-submit-box{width:100%}
  .header-utils{justify-content:space-between}
  canvas{height:170px}
  .dashboard{grid-template-columns:repeat(2,1fr);gap:6px}
  .controls-row,.items-bar{flex-direction:column;align-items:stretch}
  .lev-group{display:grid;grid-template-columns:repeat(3,1fr)}
  .lev-btn{padding:10px 4px;text-align:center}
  .trade-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .trade-btns .btn{min-height:46px;font-size:15px}
  .items-bar .btn-gacha{width:100%}
  .lb-input{flex:1;min-width:110px}
  .hide-mobile{display:none}
}
</style>
</head>

  <div class="controls-row">

      <button class="lev-btn active" onclick="setLev(1,this)">1x 現貨</button>

      <button class="btn btn-ai" id="btn-ai" onclick="startAI()">🤖 AI 代操 30s</button>

    <div><button class="btn btn-gacha" onclick="drawBox()">🎁 抽盲盒 ($2,000)</button><span style="font-size:12px;color:#8b949e;margin-left:6px">點擊使用：</span></div>

<script>
const SB_URL="https://mkdfrrmvchuovqafwyvd.supabase.co",SB_KEY="sb_publishable_HAlAC8PR6fT4sOKIttqqJw_jHdLECaj";
const canvas=document.getElementById('stockCanvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
let soundOn=true,audioCtx=null;
function toggleSound(){soundOn=!soundOn;$('btn-sound').innerText=soundOn?"🔊 音效：開":"🔇 音效：關";}
function playSound(t){
  if(!soundOn)return;
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    const cfg={
      OPEN:['triangle',520,780,.12,.11],
      WIN:['sine',587,1174,.15,.3],
      LOSS:['sawtooth',320,190,.1,.24],
      CRASH:['sawtooth',160,55,.22,.48],
      GACHA:['square',660,990,.1,.18]
    }[t];
    o.type=cfg[0];o.frequency.setValueAtTime(cfg[1],n);o.frequency.linearRampToValueAtTime(cfg[2],n+cfg[4]);
    g.gain.setValueAtTime(cfg[3],n);g.gain.exponentialRampToValueAtTime(.001,n+cfg[4]);
    o.start(n);o.stop(n+cfg[4]);
  }catch(e){}
}
function triggerCrashShake(){const b=$('terminal-box');b.classList.remove('shake-crash');void b.offsetWidth;b.classList.add('shake-crash');playSound('CRASH');}
function getRankBadge(nw){
  if(nw>=1e6)return{label:"💎 巴菲特本尊",cls:"rank-buffett"};
  if(nw>=5e5)return{label:"👑 少年股神",cls:"rank-god"};
  if(nw>=1e5)return{label:"🐺 華爾街之狼",cls:"rank-wolf"};
  if(nw>=3e4)return{label:"🔥 當沖大戶",cls:"rank-whale"};
  return{label:"🌱 菜鳥散戶",cls:"rank-rookie"};
}
function showReceipt({isLiq,stockName,side,lev,entry,exit,margin,pnl,finalCash,note}){
  const roi=margin>0?((pnl/margin)*100).toFixed(2):"0.00",c=pnl>=0?"#ff4d4f":"#00e676",s=pnl>=0?"+":"";
  $('receipt-title').innerText=isLiq?"💥 強制平倉（斷頭）結算單":(pnl>=0?"🎉 獲利平倉結算明細":"🧾 停損平倉結算明細");
  $('receipt-title').style.color=isLiq?"#ff4d4f":(pnl>=0?"#ffd700":"#58a6ff");
  $('receipt-body').innerHTML=`
    <div class="receipt-row"><span>標的</span><span>${stockName}</span></div>
    <div class="receipt-row"><span>方向/槓桿</span><span>${side==='LONG'?'🔴 做多':'🟢 放空'} ${lev}x</span></div>
    <div class="receipt-row"><span>保證金</span><span>$${margin.toLocaleString()}</span></div>
    <div class="receipt-row"><span>進場 → 結算</span><span>${entry.toFixed(2)} → ${exit.toFixed(2)}</span></div>
    <div class="receipt-row" style="border-top:1px solid #30363d;margin-top:6px;padding-top:7px"><span>已實現損益</span><span style="color:${c};font-size:15px">${s}$${Math.round(pnl).toLocaleString()} (${s}${roi}%)</span></div>
    <div class="receipt-row"><span>結算後現金</span><span style="color:#ffd700">$${finalCash.toLocaleString()}</span></div>
    ${note?`<div style="margin-top:8px;font-size:12px;color:#fbbf24;background:rgba(245,158,11,.12);padding:6px 8px;border-radius:6px">${note}</div>`:''}`;
  $('receipt-overlay').style.display='flex';
}
function closeReceipt(){$('receipt-overlay').style.display='none';}

const stocks={
  "0050":{code:"0050",seed:101,name:"元大台灣50",desc:"穩健大盤指數",base:195,price:195,vol:1.1,history:[],markers:[]},
  "2330":{code:"2330",seed:202,name:"台積電",desc:"護國神山權值王",base:1050,price:1050,vol:1.7,history:[],markers:[]},
  "2454":{code:"2454",seed:303,name:"聯發科",desc:"AI 晶片旗艦",base:1320,price:1320,vol:2.3,history:[],markers:[]},
  "2317":{code:"2317",seed:404,name:"鴻海",desc:"AI 伺服器龍頭",base:215,price:215,vol:1.9,history:[],markers:[]},
  "3481":{code:"3481",seed:505,name:"群創",desc:"面板主力飆股",base:16.5,price:16.5,vol:3.4,history:[],markers:[]}
};
const newsEvents=[
  {text:"🔥 利多：AI 訂單爆滿，外資大舉買超！",bias:.55,mode:"normal"},
  {text:"🚀 利多：法人調升目標價，主力大單敲進！",bias:.65,mode:"normal"},
  {text:"❄️ 利空：美股科技重挫，外資提款賣超！",bias:-.55,mode:"normal"},
  {text:"💥 利空：供應鏈傳砍單雜音，停損賣壓湧現！",bias:-.65,mode:"normal"},
  {text:"⚖️ 盤整：市場觀望總經數據，多空狹幅震盪。",bias:0,mode:"normal"}
];
const syncRand=(t,s)=>{let x=Math.sin(t*12.9898+s*78.233)*43758.5453;return x-Math.floor(x);};
function getGlobalMarketState(t){
  const c=t%100;
  if(c>=88&&c<=93)return{text:"🚨【突發黑天鵝】系統性流動性危機！全市場恐慌閃崩！",bias:-1.65,mode:"blackswan"};
  if(c>=44&&c<=49)return{text:"⚡【聯準會緊急降息 4 碼】史詩級資金狂潮暴力噴出！",bias:1.65,mode:"superbull"};
  return newsEvents[Math.floor(syncRand(Math.floor(t/10),999)*newsEvents.length)];
}
function computePriceAtTick(st,tick){
  let p=st.base;
  for(let t=Math.floor(tick/360)*360;t<=tick;t++){
    const ev=getGlobalMarketState(t);
    p=Math.max(2,p*(1+((syncRand(t,st.seed)-.5+ev.bias*.35)*st.vol)/100));
  }
  return p;
}
const getTaipeiDate=()=>new Date(Date.now()+288e5).toISOString().slice(0,10);
function updateResetTimer(){
  const rem=864e5-((Date.now()+288e5)%864e5),pad=n=>String(Math.floor(n)).padStart(2,'0');
  $('daily-reset-timer').innerText=`⏳ 重置：${pad(rem/36e5)}:${pad((rem%36e5)/6e4)}:${pad((rem%6e4)/1e3)}`;
}

const INIT_CAP=10000,SAVE_KEY='stock_game_save_v2',todayStr=getTaipeiDate();
let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){}
let cash=INIT_CAP,items=[],dailyReset=false;
if(saved&&saved.date===todayStr){
  if(typeof saved.cash==='number'&&saved.cash>=0)cash=saved.cash;
  if(Array.isArray(saved.items))items=saved.items;
}else if(saved&&saved.date&&saved.date!==todayStr){
  items=[{name:"🔮 每日簽到內線卡",type:"INSIDER"}];dailyReset=true;
}

let curKey="0050",lev=1,pos=null,entryPrice=0,margin=0,shield=false;
let aiOn=false,aiPaused=false,aiSec=0,aiTimer=null,aiStartEq=0,lastTick=-1,vipDrift=0,lastRank=getRankBadge(cash).label,lastSub=0;
if(localStorage.getItem('stock_game_player_name'))$('player-name').value=localStorage.getItem('stock_game_player_name');

const isVip=()=>$('player-name').value.trim()==='7676';
const calcPnL=()=>pos?margin*((stocks[curKey].price-entryPrice)/entryPrice)*lev*(pos==='LONG'?1:-1):0;
const getNetWorth=()=>pos?Math.max(0,Math.round(cash+margin+calcPnL())):Math.round(cash);
const getLiqPrice=()=>pos?(pos==='LONG'?Math.max(.01,entryPrice*(1-1/lev)):entryPrice*(1+1/lev)):0;
function saveState(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({date:getTaipeiDate(),cash:getNetWorth(),items}));}catch(e){}}
function logAI(m){const b=$('ai-log'),d=document.createElement('div');d.innerText=`> ${m}`;b.prepend(d);if(b.children.length>25)b.removeChild(b.lastChild);}
if(dailyReset){logAI("🌅 [每日重置] 00:00 新局開始！資金重置為 $10,000 並贈送【🔮 每日簽到內線卡】！");saveState();}

function addMarker(st,label,color){if(st.history.length)st.markers.push({idx:st.history.length-1,price:st.price,label,color});}
function renderTabs(){$('stock-tabs').innerHTML=Object.keys(stocks).map(k=>`<button class="stock-tab ${k===curKey?'active':''}" onclick="selectStock('${k}')">${stocks[k].code} ${stocks[k].name}</button>`).join('');}
function selectStock(k){
  if(pos)return alert("持倉中請先平倉再切換股票！");
  curKey=k;vipDrift=0;$('stock-header').innerText=`${stocks[k].code} ${stocks[k].name}`;$('stock-desc').innerText=stocks[k].desc;
  renderTabs();drawChart();updateUI();
}
function setLev(v,btn){
  if(pos||aiOn)return alert("持倉中或 AI 代操期間無法切換槓桿！");
  lev=v;document.querySelectorAll('.lev-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
}
function syncBtns(){
  $('btn-long').disabled=!!pos||aiOn;$('btn-short').disabled=!!pos||aiOn;
  $('btn-close').disabled=!pos||aiOn;$('btn-ai').disabled=aiOn;
}
function openPosition(type,byAI=false){
  if(cash<100){if(!byAI)alert("本金不足！發放 $3,000 救濟金！");cash=3000;}
  const st=stocks[curKey];pos=type;entryPrice=st.price;margin=cash;cash=0;
  addMarker(st,type==='LONG'?'B':'S',type==='LONG'?'#ff4d4f':'#00e676');
  if(!byAI){playSound('OPEN');logAI(`[開倉] ${st.code} ${type==='LONG'?'做多':'放空'} ${lev}x @ ${entryPrice.toFixed(2)} | 強平線 ${getLiqPrice().toFixed(2)}`);}
  syncBtns();drawChart();updateUI();saveState();
}
function closePosition(byAI=false){
  if(!pos)return;
  const st=stocks[curKey],pnl=calcPnL(),pSide=pos,pLev=lev,pEnt=entryPrice,pMar=margin,exP=st.price;
  cash=Math.max(0,Math.round(margin+pnl));pos=null;entryPrice=0;margin=0;shield=false;
  addMarker(st,'平','#f59e0b');
  if(!byAI){playSound(pnl>=0?'WIN':'LOSS');showReceipt({isLiq:false,stockName:`${st.code} ${st.name}`,side:pSide,lev:pLev,entry:pEnt,exit:exP,margin:pMar,pnl,finalCash:cash,note:""});}
  syncBtns();drawChart();updateUI();saveState();
}
function startAI(){
  if(aiOn||pos)return alert("請先平倉再啟動 AI 代操！");
  if(cash<100)cash=3000;
  aiOn=true;aiPaused=false;aiSec=30;aiStartEq=cash;
  $('ai-banner').style.display='flex';$('ai-state-label').innerText="接管中";$('btn-ai-pause').innerText="⏸️ 暫停觀察";$('ai-timer').innerText=aiSec;
  syncBtns();playSound('OPEN');logAI(`[AI 啟動] 本金 $${aiStartEq.toLocaleString()}（可隨時按暫停查看日誌）`);
  aiTimer=setInterval(()=>{if(!aiPaused&&--aiSec<=0)stopAI(false);else $('ai-timer').innerText=aiSec;},1000);
}
function togglePauseAI(){
  if(!aiOn)return;aiPaused=!aiPaused;const b=$('btn-ai-pause');
  b.innerText=aiPaused?"▶️ 繼續代操":"⏸️ 暫停觀察";b.style.background=aiPaused?"#059669":"#d97706";
  $('ai-state-label').innerText=aiPaused?"已暫停":"接管中";
  logAI(aiPaused?"[AI 暫停] 凍結倒數與自動下單，方便檢視日誌。":"[AI 恢復] 繼續執行量化交易！");
}
function stopAI(manual){
  if(!aiOn)return;clearInterval(aiTimer);if(pos)closePosition(true);
  aiOn=false;aiPaused=false;$('ai-banner').style.display='none';syncBtns();
  const p=cash-aiStartEq;playSound(p>=0?'WIN':'LOSS');saveState();
  logAI(`[AI 結算] ${manual?"手動中止":"30s期滿"}！結算 $${cash.toLocaleString()} (${p>=0?'+':''}$${p.toLocaleString()})`);
}
function runAIStrategy(bias){
  if(aiPaused)return;
  const s=stocks[curKey],h=s.history,n=h.length;if(n<6)return;
  const mom=((h[n-1]+h[n-2]+h[n-3])-(h[n-4]+h[n-5]+h[n-6]))/(h[n-4]+h[n-5]+h[n-6]);
  const vip=isVip(),sig=vip?(mom*140+bias*1.3):(mom*100+bias*.8),th=vip?.15:.25;
  if(!pos){
    if(Math.abs(sig)>th){
      lev=vip?(Math.abs(sig)>.35?20:5):(Math.abs(sig)>.6?5:1);
      document.querySelectorAll('.lev-btn').forEach(b=>b.classList.toggle('active',b.innerText.startsWith(lev+'x')));
      openPosition(sig>0?'LONG':'SHORT',true);
      logAI(`[AI ${sig>0?'做多':'放空'}] 訊號 ${sig.toFixed(2)} | ${s.code} ${lev}x @ ${s.price.toFixed(2)}`);
    }
  }else{
    const pnl=calcPnL(),roi=pnl/margin,tp=vip?.14:.08,sl=vip?-.025:-.06;
    if(roi>=tp||roi<=sl||(pos==='LONG'&&sig<-.2)||(pos==='SHORT'&&sig>.2)){
      closePosition(true);logAI(`[AI 平倉] ${roi>=tp?'停利':(roi<=sl?'停損':'均線反轉')} $${Math.round(pnl).toLocaleString()} (${(roi*100).toFixed(1)}%)`);
    }
  }
}
function drawBox(){
  if(cash<2000)return alert("現金不足 $2,000！");
  cash-=2000;playSound('GACHA');
  const r=isVip()?(Math.random()*.55+.45):Math.random();
  if(r<.35){items.push({name:"🔮 內線消息卡",type:"INSIDER"});alert("抽中【🔮 內線消息卡】！可預知下一波大盤新聞。");}
  else if(r<.7){items.push({name:"🛡️ 防爆倉護身符",type:"SHIELD"});alert("抽中【🛡️ 防爆倉護身符】！強平時保住 80% 本金。");}
  else{cash+=5000;playSound('WIN');alert("🎉 頭獎！抽中【💰 大戶空投支票】，現金 +$5,000！");}
  renderItems();updateUI();saveState();
}
function useItem(i){
  const it=items.splice(i,1)[0];playSound('OPEN');
  if(it.type==="INSIDER"){
    $('insider-hint').innerText=`🤫 內線預知：${getGlobalMarketState(lastTick+10).text.slice(0,14)}...`;
    setTimeout(()=>$('insider-hint').innerText="",7500);
  }else{shield=true;alert("🛡️ 防爆倉護身符已啟動！");}
  renderItems();saveState();
}
function renderItems(){
  $('items-list').innerHTML=items.length?items.map((it,i)=>`<span class="item-tag" onclick="useItem(${i})">${it.name}</span>`).join(''):`<span style="font-size:12px;color:#6e7681">(尚無道具)</span>`;
}
function updateUI(){
  const s=stocks[curKey],prev=s.history[s.history.length-2]||s.price,pct=((s.price-prev)/prev)*100;
  $('price-val').innerText=s.price.toFixed(2);$('pct-val').innerText=`(${pct>=0?'+':''}${pct.toFixed(2)}%)`;
  $('price-val').className=`price-display ${pct>=0?'up':'down'}`;$('pct-val').className=pct>=0?'up':'down';
  const nw=getNetWorth();$('cash-val').innerText=`$${cash.toLocaleString()}`;
  $('networth-preview').innerText=`總淨值：$${nw.toLocaleString()}（每日 00:00 重置新局）`;
  const b=getRankBadge(nw);$('player-rank-badge').innerText=b.label;$('player-rank-badge').className=`rank-badge ${b.cls}`;
  if(b.label!==lastRank){if(nw>INIT_CAP)logAI(`[段位晉升] 晉升為【${b.label}】！`);lastRank=b.label;}

  const liqBox=$('liq-warning-box');
  if(pos){
    $('pos-val').innerText=`${aiOn?'🤖 ':''}${pos==='LONG'?'做多':'放空'} ${lev}x ${shield?'🛡️':''}`;
    $('pos-val').style.color=pos==='LONG'?'#ff4d4f':'#00e676';$('entry-val').innerText=entryPrice.toFixed(2);
    const pnl=Math.round(calcPnL());$('pnl-val').innerText=`${pnl>=0?'+':''}$${pnl.toLocaleString()}`;$('pnl-val').style.color=pnl>=0?'#ff4d4f':'#00e676';

    const liqP=getLiqPrice(),rem=Math.max(0,Math.min(100,((margin+pnl)/margin)*100)),dist=Math.abs((s.price-liqP)/s.price)*100;
    liqBox.style.display='block';$('liq-price-text').innerText=`⚠️ 強平價：${liqP.toFixed(2)}（距爆倉 ${dist.toFixed(2)}%）`;
    const bt=$('liq-buffer-text'),bf=$('liq-bar-fill');bf.style.width=`${rem}%`;
    bt.innerText=rem<=30?`🚨 高危：保證金僅剩 ${rem.toFixed(0)}%`:(rem<=65?`⚡ 注意：保證金剩餘 ${rem.toFixed(0)}%`:`🛡️ 安全：保證金健康度 ${rem.toFixed(0)}%`);
    bt.style.color=bf.style.background=rem<=30?"#ff4d4f":(rem<=65?"#fbbf24":"#00e676");
    bf.classList.toggle('liq-danger-blink',rem<=30);

    if(margin+pnl<=0){
      if(isVip()){entryPrice=s.price*(pos==='LONG'?.992:1.008);return;}
      const pSide=pos,pLev=lev,pEnt=entryPrice,pMar=margin,hadShield=shield;
      cash=hadShield?Math.round(margin*.8):0;pos=null;entryPrice=0;margin=0;shield=false;liqBox.style.display='none';syncBtns();saveState();
      if(hadShield){
        playSound('OPEN');logAI(`[護身符發動] 觸及強平線，保住 80% 本金 ($${cash.toLocaleString()})！`);
        if(!aiOn)showReceipt({isLiq:true,stockName:`${s.code} ${s.name}`,side:pSide,lev:pLev,entry:pEnt,exit:s.price,margin:pMar,pnl:-(pMar-cash),finalCash:cash,note:"🛡️ 已觸發【防爆倉護身符】，救回 80% 保證金！"});
      }else{
        triggerCrashShake();logAI(`[強制平倉] ${s.code} ${pLev}x 觸及強平價，保證金 $${pMar.toLocaleString()} 已清算。`);
        if(!aiOn)showReceipt({isLiq:true,stockName:`${s.code} ${s.name}`,side:pSide,lev:pLev,entry:pEnt,exit:s.price,margin:pMar,pnl:-pMar,finalCash:0,note:`💡 ${pLev}x 槓桿下反向波動超過 ${(100/pLev).toFixed(1)}% 觸發強制平倉。`});
      }
    }
  }else{
    liqBox.style.display='none';$('pos-val').innerText=aiOn?(aiPaused?"⏸️ AI 暫停":"🤖 AI 觀察中"):"空手觀望";
    $('pos-val').style.color="#8b949e";$('entry-val').innerText="-";$('pnl-val').innerText="$0";$('pnl-val').style.color="#e6edf3";
  }
}
function drawChart(){
  const st=stocks[curKey],h=st.history,w=canvas.width,ch=canvas.height;if(h.length<2)return;
  ctx.clearRect(0,0,w,ch);
  let minP=Math.min(...h),maxP=Math.max(...h);
  if(pos&&entryPrice>0){minP=Math.min(minP,entryPrice);maxP=Math.max(maxP,entryPrice);}
  minP*=.996;maxP*=1.004;const rng=maxP-minP||1,getY=v=>ch-((v-minP)/rng)*(ch-34)-17;
  ctx.strokeStyle="#161b22";ctx.lineWidth=1;
  for(let i=1;i<4;i++){const y=(ch/4)*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  if(pos&&entryPrice>0){
    const ey=getY(entryPrice),liqP=getLiqPrice();
    ctx.save();ctx.setLineDash([6,4]);ctx.strokeStyle=pos==='LONG'?"rgba(255,77,79,.85)":"rgba(0,230,118,.85)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,ey);ctx.lineTo(w,ey);ctx.stroke();ctx.restore();
    ctx.fillStyle=pos==='LONG'?"#ff4d4f":"#00e676";ctx.font="bold 12px JetBrains Mono,monospace";
    ctx.fillText(`進場 ${entryPrice.toFixed(2)}`,8,Math.max(15,ey-5));
    if(liqP>=minP&&liqP<=maxP){
      const ly=getY(liqP);ctx.save();ctx.setLineDash([3,3]);ctx.strokeStyle="#fbbf24";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(w,ly);ctx.stroke();ctx.restore();
      ctx.fillStyle="#fbbf24";ctx.fillText(`⚠️ 強平 ${liqP.toFixed(2)}`,8,Math.min(ch-6,ly+13));
    }
  }
  const isUp=h[h.length-1]>=h[h.length-2],lc=isUp?"#ff4d4f":"#00e676";
  ctx.beginPath();ctx.strokeStyle=lc;ctx.lineWidth=3;
  h.forEach((v,i)=>{const x=(i/(h.length-1))*w,y=getY(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  ctx.lineTo(w,ch);ctx.lineTo(0,ch);ctx.closePath();
  const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,isUp?"rgba(255,77,79,.28)":"rgba(0,230,118,.28)");g.addColorStop(1,"rgba(13,17,23,0)");
  ctx.fillStyle=g;ctx.fill();
  st.markers.forEach(m=>{
    if(m.idx<0||m.idx>=h.length)return;
    const mx=(m.idx/(h.length-1))*w,my=getY(m.price);
    ctx.beginPath();ctx.arc(mx,my,9,0,Math.PI*2);ctx.fillStyle=m.color;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle="#0d1117";ctx.stroke();
    ctx.fillStyle="#fff";ctx.font="bold 10px Noto Sans TC,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(m.label,mx,my);ctx.textAlign="start";ctx.textBaseline="alphabetic";
  });
}

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadLeaderboard(){
  const tb=$('lb-body');
  try{
    const r=await fetch(`${SB_URL}/rest/v1/leaderboard?select=*&net_worth=gt.10000&order=net_worth.desc&limit=50`,{headers:{apikey:SB_KEY}});
    if(!r.ok)throw new Error('讀取失敗');
    const map=new Map();(await r.json()||[]).forEach(row=>{const k=String(row.player_name||'').trim().toLowerCase();if(k&&!map.has(k))map.set(k,row);});
    const data=Array.from(map.values()).slice(0,10);
    if(!data.length){tb.innerHTML=`<tr><td colspan="5" style="text-align:center;color:#8b949e;padding:14px">尚無獲利玩家上榜，快搶頭香！</td></tr>`;return;}
    tb.innerHTML=data.map((row,i)=>{
      const nw=+row.net_worth,bg=getRankBadge(nw),roi=+row.return_rate,d=new Date(row.created_at);
      return `<tr><td><strong>${['🥇 1','🥈 2','🥉 3'][i]||`#${i+1}`}</strong></td><td style="font-family:'Noto Sans TC',sans-serif;font-weight:700">${esc(row.player_name)}<span class="rank-badge ${bg.cls}">${bg.label}</span></td><td style="text-align:right;color:#ffd700;font-weight:700">$${nw.toLocaleString()}</td><td style="text-align:right;color:${roi>=0?'#ff4d4f':'#00e676'}">${roi>=0?'+':''}${roi.toFixed(1)}%</td><td class="hide-mobile" style="text-align:right;color:#8b949e;font-size:12px">${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</td></tr>`;
    }).join('');
  }catch(e){tb.innerHTML=`<tr><td colspan="5" style="text-align:center;color:#ff4d4f;padding:14px">⚠️ 連線失敗：${e.message}</td></tr>`;}
}
async function submitScore(){
  const now=Date.now();
  if(now-lastSub<15000)return alert(`請等待 ${Math.ceil((15000-(now-lastSub))/1000)} 秒後再上傳！`);
  const inp=$('player-name'),name=inp.value.replace(/\s+/g,' ').trim();
  if(!name){inp.focus();return alert("請先輸入暱稱！");}
  const lkName=localStorage.getItem('stock_game_locked_name'),lkTime=+localStorage.getItem('stock_game_locked_time')||0;
  if(name!=='7676'&&lkName&&lkName!==name&&now-lkTime<6e5){
    const rem=6e5-(now-lkTime);inp.value=lkName;
    return alert(`⏳ 每 10 分鐘只能改名一次！\n鎖定暱稱：「${lkName}」，請等待 ${Math.floor(rem/6e4)} 分 ${Math.ceil((rem%6e4)/1e3)} 秒。`);
  }
  const nw=getNetWorth();
  if(nw<=INIT_CAP)return alert("總淨值必須超過 $10,000 才能上榜！");
  if(nw>999999999)return alert("數值異常！");
  const roi=+(((nw-INIT_CAP)/INIT_CAP)*100).toFixed(2),btn=$('btn-submit-score');
  btn.disabled=true;btn.innerText="上傳中...";
  try{
    const chk=await(await fetch(`${SB_URL}/rest/v1/leaderboard?select=*&player_name=eq.${encodeURIComponent(name)}&order=net_worth.desc&limit=1`,{headers:{apikey:SB_KEY}})).json();
    const hdr={'apikey':SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'};
    if(chk&&chk.length){
      if(nw<=+chk[0].net_worth)return alert(`「${name}」最高紀錄為 $${(+chk[0].net_worth).toLocaleString()}，未破紀錄不覆蓋！`);
      const p=await fetch(`${SB_URL}/rest/v1/leaderboard?id=eq.${chk[0].id}`,{method:'PATCH',headers:hdr,body:JSON.stringify({net_worth:nw,return_rate:roi,created_at:new Date().toISOString()})});
      if(!p.ok)await fetch(`${SB_URL}/rest/v1/leaderboard`,{method:'POST',headers:hdr,body:JSON.stringify({player_name:name,net_worth:nw,return_rate:roi})});
    }else{
      const p=await fetch(`${SB_URL}/rest/v1/leaderboard`,{method:'POST',headers:hdr,body:JSON.stringify({player_name:name,net_worth:nw,return_rate:roi})});
      if(!p.ok)throw new Error('寫入失敗');
    }
    localStorage.setItem('stock_game_player_name',name);
    if(!lkName||lkName!==name){localStorage.setItem('stock_game_locked_name',name);localStorage.setItem('stock_game_locked_time',String(Date.now()));}
    lastSub=Date.now();saveState();playSound('WIN');
    logAI(`[全球排行] ${name} 刷新最高戰績：$${nw.toLocaleString()} (+${roi}%)`);await loadLeaderboard();
  }catch(e){alert("上傳失敗："+e.message);}finally{btn.disabled=false;btn.innerText="🚀 上傳";}
}

function syncTickLoop(){
  const t=Math.floor(Date.now()/800);if(t===lastTick)return;lastTick=t;
  const ev=getGlobalMarketState(t),tk=$('news-ticker');
  $('news-text').innerText=ev.text;
  tk.className='news-ticker'+(ev.mode==='blackswan'?' news-blackswan':'')+(ev.mode==='superbull'?' news-superbull':'');
  const vip=isVip();
  Object.keys(stocks).forEach(k=>{
    const st=stocks[k];
    if(!st.history.length)for(let i=59;i>=0;i--)st.history.push(computePriceAtTick(st,t-i));
    else{st.history.push(computePriceAtTick(st,t));if(st.history.length>60){st.history.shift();st.markers.forEach(m=>m.idx--);st.markers=st.markers.filter(m=>m.idx>=0);}}
    let p=st.history[st.history.length-1];
    if(vip&&k===curKey&&pos){vipDrift+=(pos==='LONG'?.0022:-.0022);p=Math.max(2,p*(1+vipDrift));st.history[st.history.length-1]=p;}
    st.price=p;
  });
  if(aiOn)runAIStrategy(ev.bias);
  drawChart();updateUI();
}

window.addEventListener('beforeunload',saveState);
renderTabs();renderItems();updateResetTimer();syncTickLoop();loadLeaderboard();
setInterval(syncTickLoop,200);setInterval(updateResetTimer,1000);setInterval(loadLeaderboard,15000);
</script>
